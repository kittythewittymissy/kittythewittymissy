  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Codystar:wght@300;400;500;600&family=Raleway:wght@100&family=Raleway+Dots&display=swap" rel="stylesheet">

  <!-- Global CSS -->
  <link rel="stylesheet" href="style.css">

  <style>
     /* ===== GLOBAL BOX-SIZING ===== */
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }
    /* HERO SECTION */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    /* HERO CONTAINER */
    .gold-hero-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 80%;
      max-width: 1200px;
      padding: 6px 40px; /* tight vertical padding */
      border: 2px solid rgba(255,255,255,0.85);
      box-shadow:
        0 0 8px rgba(255,255,255,0.35),
        0 0 18px rgba(255,214,98,0.25);
      animation: neonBlaze var(--anim-speed-hero) forwards;
      overflow: visible; 
    }

      .gold-hero {
      font-size: 5em;
      line-height: 1;
    
      text-shadow:
        0 0 6px rgba(255,255,255,0.9),
        0 0 12px rgba(255,255,255,0.7),
        0 0 18px rgba(255,214,98,0.7);
    
      -webkit-font-smoothing: antialiased;
      transform: translateZ(0);
    }

    .next-part {
      opacity: 0;
      animation-name: arrowFadeIn;
      animation-duration: 2s;
      animation-timing-function: ease;
      animation-delay: 5.7s;
      animation-fill-mode: forwards;
    }

    @keyframes arrowFadeIn {
      0% { opacity: 0; transform: translateY(0); }
    100% { opacity: 1; transform: translateY(7px); }
    }

    /* COLUMNS */
    .section-columns {
      display: flex;
      justify-content: center;
      gap: 200px; /* floating/void feel */
      margin: 60px 20px 120px;
      opacity: 0;
      animation: fadeInColumns 2s forwards ease-in-out 1s;
    }

    @keyframes fadeInColumns {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .column {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 500px;
      text-align: center;
      font-size: 1.2em; 
    }

    .column h2.main-column-heading {
      font-size: 2.5em; 
      margin-bottom: 0.3em;
    }

    .column h2.column-subheading {
      font-size: 2em;
      margin-bottom: 0.2em;
    }

    .column ul {
      list-style: none;
      padding: 0;
      margin: 0;
      min-height: 120px;
    }

    .column ul li {
      font-size: 1.1em;
    }

    /* Links hover glow */
    .column ul li a {
      transition: all 0.3s ease;
    }

    .column ul li a:hover {
      text-shadow: 0 0 8px #fff, 0 0 16px #fff;
      color: var(--gold-core);
    }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  /* HERO CONTAINER */
  .gold-hero-container {
    width: 90%;
    max-width: 350px;
    padding: 4px 18px;       
    border: 1.5px solid rgba(255,255,255,0.85);
    box-shadow:
      0 0 4px rgba(255,255,255,0.35),
      0 0 10px rgba(255,214,98,0.25);

  }

  /* HERO */
  .gold-hero {
    font-size: 4.3em;
    line-height: 1;
  
    text-shadow:
      0 0 6px #fff,
      0 0 12px #fff,
      0 0 16px #FFD662;
  }  
  
  /* ONE COLUMN MODE */
  .section-columns {
    flex-direction: column;
    align-items: center;
    gap: 50px;
    margin: 40px 0 80px;
    padding: 0 18px;  
    box-sizing: border-box;
  }
  
    /* ===== ARROW FADE-IN AFTER HERO ===== */
    .next-part {
      opacity: 0; /* start invisible */
      animation-name: arrowFadeIn;
      animation-duration: 2s;
      animation-timing-function: ease;
      animation-delay: 5.7s; /* fade-in starts after 5.7s */
      animation-fill-mode: forwards; /* stay visible after animation */
    }

  </style>
</head>

  <script>
 
    document.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', function(e) {
        const href = link.getAttribute('href');
        if (!realPages.some(page => href.endsWith(page))) {
          e.preventDefault();
          window.location.href = 'under-creation-!.html';
        }
      });
    });

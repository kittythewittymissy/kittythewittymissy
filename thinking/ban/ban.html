<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bàn</title>

<!-- GLOBAL CSS -->
<link rel="stylesheet" href="../../style.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;600&family=Raleway+Dots&display=swap" rel="stylesheet">

<style>

/* ===== PAGE-SPECIFIC ONLY ===== */

.stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.circle {
  position: absolute;
  width: 440px;
  height: 440px;
  border-radius: 50%;
  border: 1px dashed rgba(255,255,255,0.25);
  box-shadow:
    0 0 12px rgba(255,255,255,0.08),
    0 0 24px rgba(255,255,255,0.04);
  animation: orbit 90s linear infinite;
}

.work-title { 
  position: absolute;
  top: 2rem;
  left: 5rem;
  padding: 0;
}

.paragraph {
  max-width: 520px;
  text-align: center;
  opacity: 0;
  animation: bodyFade 1.2s ease forwards;
  animation-delay: 0.6s;
}

.center-bold {
  display: block;
  margin-top: 1.5rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-shadow: var(--glow-white);
  opacity: 0;
  animation: bodyFade 1s ease forwards;
  animation-delay: 1.8s;
}

/* INPUT */
.input {
  position: fixed;
  bottom: 12%;
  left: 50%;
  transform: translateX(-50%);
  width: 280px;
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(255,214,98,0.4);
  color: var(--white-accent);
  font-family: 'Raleway', sans-serif;
  font-weight: 100;
  font-size: 1rem;
  text-align: center;
  padding: 6px;
  outline: none;
  opacity: 0;
  animation: bodyFade 1s ease forwards;
  animation-delay: 2.4s;
}

.input::placeholder {
  color: rgba(255,255,255,0.35);
}

.input:focus {
  border-bottom: 1px solid var(--gold-core);
  box-shadow: 0 0 8px var(--gold-bloom);
}

/* ORBIT */
.orbit {
  position: absolute;
  width: 520px;
  height: 520px;
  animation: orbit 30s linear infinite;
}

.response {
  position: absolute;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1px dashed var(--gold-core);
  box-shadow:
    0 0 6px var(--gold-core),
    0 0 14px var(--gold-bloom);
  cursor: pointer;

  opacity: 0;
  transform: translate(-50%, -50%) scale(0.6);
  transition: opacity 0.6s ease, transform 0.6s ease;
}

.response.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

/* CENTERED OVERLAY TEXT */
#singleResponse {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  max-width: 700px;
  text-align: center;

  font-size: 1.8rem;
  font-weight: 200;
  line-height: 1.8;
}

/* Fade */
@keyframes bodyFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

</style>
</head>

<body>

<div class="work-title">
  <h1>Bàn</h1>
</div>

<div class="stage">

  <div class="circle"></div>

  <div class="paragraph body-text">
    You think understanding something means you’ve faced it.
    But most of the time, you’ve only found a way to explain it without feeling it.
    That’s not clarity. That’s distance.

    <span class="center-bold">Bạn nghĩ sao?</span>
  </div>

  <div class="orbit" id="orbit"></div>

</div>

<input id="input" class="input" placeholder="Bạn nghĩ sao?" />

<!-- SINGLE RESPONSE OVERLAY -->
<div class="timeline-overlay" id="overlay">
  <div id="singleResponse" class="body-text"></div>
</div>

<script>

const input = document.getElementById("input");
const orbit = document.getElementById("orbit");
const overlay = document.getElementById("overlay");
const display = document.getElementById("singleResponse");

// LOAD
let responses = JSON.parse(localStorage.getItem("ban_responses")) || [];

// CREATE NODE
function createNode(text) {
  const angle = Math.random() * Math.PI * 2;
  const radius = 220;

  const orbitSize = 520;
  const center = orbitSize / 2;

  const x = center + radius * Math.cos(angle);
  const y = center + radius * Math.sin(angle);

  const node = document.createElement("div");
  node.className = "response";
  node.style.left = x + "px";
  node.style.top = y + "px";

  let clickTimer = null;

  node.addEventListener("click", (e) => {
    if (e.shiftKey) {
      if (clickTimer) {
        clearTimeout(clickTimer);
        clickTimer = null;

        const index = responses.indexOf(text);
        if (index > -1) {
          responses.splice(index, 1);
          localStorage.setItem("ban_responses", JSON.stringify(responses));
          node.remove();
        }
      } else {
        clickTimer = setTimeout(() => {
          clickTimer = null;
        }, 250);
      }
    } else {
      overlay.classList.add("is-open");
      display.innerText = text;
    }
  });

  orbit.appendChild(node);

  // EASE-IN ANIMATION
  requestAnimationFrame(() => {
    node.classList.add("show");
  });
}

// INITIAL LOAD
responses.forEach(createNode);

// INPUT
input.addEventListener("keydown", function(e) {
  if (e.key === "Enter" && input.value.trim() !== "") {
    const text = input.value.trim();

    responses.push(text);
    localStorage.setItem("ban_responses", JSON.stringify(responses));

    createNode(text);

    input.value = "";
  }
});

// CLICK OVERLAY TO CLOSE
overlay.onclick = () => {
  overlay.classList.remove("is-open");
};

</script>

</body>
</html>

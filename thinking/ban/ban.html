<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bàn</title>

<!-- Favicon -->
<link rel="icon" href="../../favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="../../favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../favicon/apple-touch-icon.png">
<link rel="manifest" href="favicon/site.webmanifest">

<!-- GLOBAL CSS -->
<link rel="stylesheet" href="../../style.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;600&family=Raleway+Dots&family=Codystar:wght@300;400;500&display=swap&subset=vietnamese" rel="stylesheet">

<style>

/* ===== PAGE-SPECIFIC ONLY ===== */

.stage {
  position: fixed;
  inset: 0;
}

.circle {
  position: absolute;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  width: 440px;
  height: 440px;

  border-radius: 50%;

  border: 1px dashed rgba(255,255,255,0.25);

  box-shadow:
    0 0 12px rgba(255,255,255,0.08),
    0 0 24px rgba(255,255,255,0.04);

  animation: orbit 90s linear infinite;
}

/* ===== TITLE ===== */

.work-title {
  position: fixed;

  top: 0;
  left: 0;

  padding: 2rem 5rem;

  z-index: 20;
}

.work-title h1 {
  font-family: 'Raleway', sans-serif;

  font-size: 4rem;
  font-weight: 100;

  letter-spacing: 0.22em;

  color: var(--gold-core);

  text-shadow:
    0 0 2px var(--gold-core),
    0 0 6px var(--gold-core),
    0 0 14px rgba(255,214,98,0.7);

  opacity: 0;

  animation: neonSign-Gold 1.2s ease forwards;
  animation-delay: 0.3s;
}

@keyframes neonSign-Gold {

  0% {
    opacity: 0;
    color: #222;
    text-shadow: none;
  }

  8% {
    opacity: 1;
    color: var(--gold-core);
    text-shadow: 0 0 3px var(--gold-core);
  }

  16% {
    opacity: 0;
    color: #222;
    text-shadow: none;
  }

  25% {
    opacity: 1;

    text-shadow:
      0 0 6px var(--gold-core),
      0 0 10px rgba(255,214,98,0.7);
  }

  50% {
    opacity: 1;

    color: #fff;

    text-shadow:
      0 0 10px #fff,
      0 0 18px var(--gold-core);
  }

  100% {
    opacity: 1;

    color: var(--gold-core);

    text-shadow:
      0 0 2px var(--gold-core),
      0 0 6px var(--gold-core),
      0 0 12px rgba(255,214,98,0.8),
      0 0 16px rgba(255,214,98,0.6);
  }
}

/* ===== CENTER TEXT ===== */

.paragraph {
  position: absolute;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  max-width: 520px;

  margin: 0 auto;

  text-align: center;

  font-size: 1.25rem;

  opacity: 0;

  animation: bodyFade 1.2s ease forwards;
  animation-delay: 0.6s;
}

/* ===== ORBIT ===== */

.orbit {
  position: absolute;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  width: 520px;
  height: 520px;

  animation: orbit 30s linear infinite;
}

/* ===== FADE ===== */

@keyframes bodyFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* =========================
   TIMELINE OVERLAY MENU
========================= */

.vertical-menu {
  justify-content: center;
  padding: 0;
}

.vertical-menu .timeline-list {
  flex-direction: column;
  gap: 2.8rem;
}

.vertical-menu .timeline-item {
  min-width: auto;
  padding: 0;

  display: flex;
  align-items: center;
  justify-content: flex-start;

  text-decoration: none;

  transition:
    transform 0.25s ease,
    opacity 0.25s ease;
}

.vertical-menu .timeline-item:hover {
  transform: translateX(-6px);
}

.vertical-menu .timeline-dot {
  position: relative;

  left: auto;
  top: auto;

  transform: none;

  margin-right: 1.2rem;

  width: 14px;
  height: 14px;
}

.vertical-menu .timeline-content {
  position: relative;

  left: auto;
  top: auto;
  bottom: auto;

  transform: none;

  width: auto;

  text-align: left;
}

.vertical-menu .timeline-title {
  font-size: 2rem;
  letter-spacing: 0.12em;
}

.vertical-menu .timeline-item:hover .timeline-title {
  color: var(--gold-core);

  text-shadow:
    0 0 6px var(--gold-core),
    0 0 16px var(--gold-bloom);
}

/* ===== TOGGLE ===== */

.timeline-toggle {
  z-index: 700;
}

/* ===== MOBILE ===== */

@media(max-width:768px) {

  .circle {
    width: 300px;
    height: 300px;
  }

  .orbit {
    width: 360px;
    height: 360px;
  }

  .work-title {
    padding:
      4rem
      1.5rem
      2rem
      1.5rem;
  }

  .work-title h1 {
    font-size: 2.8rem;

    line-height: 1.2;

    -webkit-text-stroke: 0;
  }

  .paragraph {
    max-width: 88%;

    font-size: 1.05rem;
    line-height: 1.8;
  }

  .vertical-menu .timeline-title {
    font-size: 1.5rem;
  }

  .vertical-menu .timeline-list {
    gap: 2rem;
  }

  .vertical-menu .timeline-dot {
    width: 12px;
    height: 12px;
  }

  .timeline-toggle {
    width: 56px;
    height: 56px;

    right: 1rem;
    bottom: 5rem;
  }

  .back-button {
    top: 1rem;
    right: 1rem;
  }

  .back-button .kitty-text {
    font-size: 2rem;
  }

  .back-button .back-text {
    font-size: 1rem;
  }
}

</style>
</head>

<body>

<!-- BACK BUTTON -->

<a href="../../index.html" class="back-button">
  <span class="back-text">Back to</span>
  <span class="kitty-text">Kitty</span>
</a>

<!-- MAIN STAGE -->

<div class="stage">

  <div class="circle"></div>

  <div class="work-title">
    <h1>Bàn</h1>
  </div>

  <div class="paragraph body-text">
    Ta vào bàn, để bàn.
  </div>

  <div class="orbit"></div>

  <!-- TIMELINE TOGGLE -->

  <div class="timeline-toggle" id="timelineToggle"></div>

</div>

<!-- MENU OVERLAY -->

<div class="timeline-overlay" id="timelineOverlay">

  <div class="timeline-wrap vertical-menu">

    <div class="timeline-list">

      <a href="topic-1.html" class="timeline-item">

        <div class="timeline-dot"></div>

        <div class="timeline-content">
          <div class="timeline-title">Ý thức</div>
        </div>

      </a>

      <a href="topic-2.html" class="timeline-item">

        <div class="timeline-dot"></div>

        <div class="timeline-content">
          <div class="timeline-title">Tự do</div>
        </div>

      </a>

      <a href="topic-3.html" class="timeline-item">

        <div class="timeline-dot"></div>

        <div class="timeline-content">
          <div class="timeline-title">Cái đẹp</div>
        </div>

      </a>

    </div>

  </div>

</div>

<script>

/* ===== TIMELINE MENU ===== */

const timelineToggle = document.getElementById('timelineToggle');

const timelineOverlay = document.getElementById('timelineOverlay');

timelineToggle.addEventListener('click', () => {
  timelineOverlay.classList.toggle('is-open');
});

timelineOverlay.addEventListener('click', (e) => {

  if (e.target === timelineOverlay) {
    timelineOverlay.classList.remove('is-open');
  }

});

</script>

</body>
</html>

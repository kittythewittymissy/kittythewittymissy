<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bàn</title>

<!-- Favicon -->
<link rel="icon" href="../../favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="../../favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../favicon/apple-touch-icon.png">
<link rel="manifest" href="favicon/site.webmanifest">

<!-- GLOBAL CSS -->
<link rel="stylesheet" href="../../style.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;600&family=Raleway+Dots&family=Codystar:wght@300;400;500&display=swap&subset=vietnamese" rel="stylesheet">

<style>

/* ===== STAGE ===== */

.stage {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== OVAL TABLE ===== */

.oval-table {
position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 98vw;
  height: 89vh;
  border-radius: 50%;
  box-shadow:
      0 0 8px rgba(255,255,255,0.13),
      0 0 16px rgba(255,255,255,0.07);
  pointer-events: none;
  z-index: 0;
}

/* ===== GHOST TITLE ===== */

.series-background {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  font-family: 'Raleway Dots', sans-serif;
  font-size: 18rem;

  color: var(--gold-core);
  opacity: 0.15;

  pointer-events: none;
  user-select: none;

  z-index: 0;
}

/* ===== TOPIC ===== */

.paragraph {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  max-width: 520px;
  text-align: center;
  font-size: 1.25rem;
  opacity: 0;
  animation: bodyFade 1.2s ease forwards;
  animation-delay: 0.6s;
  z-index: 10;
}

.center-bold {
  display: block;
  margin-top: 1rem;
  font-weight: 600;
  font-size: 1.4rem;
  letter-spacing: 0.05em;
  text-shadow: var(--glow-white);
  opacity: 0;
  animation: bodyFade 1s ease forwards;
  animation-delay: 1.8s;
  z-index: 10;
}

/* ===== FADE ===== */

@keyframes bodyFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ===== ORBIT ===== */
.orbit-wrap {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

.orbit {
  position: relative;
  width: 440px;
  height: 440px;
  z-index: 2;
  animation: orbit 90s linear infinite;
}

@keyframes orbit {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

.orbit::before {
  content: "";

  position: absolute;
  inset: 0;

  border-radius: 50%;

  border: 1px dashed rgba(255,255,255,0.36);

  box-shadow:
    0 0 10px rgba(255,255,255,0.20),
    0 0 20px rgba(255,255,255,0.11),
    0 0 40px rgba(255,255,255,0.045);
}

html, body { overflow: hidden; }

/* ===== MOBILE ===== */

@media(max-width:768px) {

  .oval-table {
    display: none;
  }

  .orbit {
    width: 360px;
    height: 360px;
  }

  .series-background {
    font-size: 9rem;
}

  .paragraph {
    width: 88%;
    max-width: 520px;
    font-size: 1.15rem;
    line-height: 1.8;
}

  .center-bold {
    font-size: 1.15rem;
  }

  .timeline-toggle {
    width: 56px;
    height: 56px;
    right: 1rem;
    bottom: 5rem;
  }

  .back-button {
    top: 1rem;
    right: 1rem;
  }

  .back-button .kitty-text {
    font-size: 2rem;
  }

  .back-button .back-text {
    font-size: 1rem;
  }
}

</style>
</head>

<body>

<!-- BACK BUTTON -->

<a href="../../index.html" class="back-button">
  <span class="back-text">Back to</span>
  <span class="kitty-text">Kitty</span>
</a>

<!-- 'THE EYE' STAGE' -->
<div class="stage">

  <div class="series-background">Bàn</div>
  <div class="oval-table"></div>

  <div class="paragraph">
    Ta đặt lên bàn.

    <span class="center-bold">
      Ta bàn.
    </span>
  </div>

</div>

<div class="orbit-wrap">
  <div class="orbit"></div>
</div>

<!-- TIMELINE TOGGLE -->

<div class="timeline-toggle" id="timelineToggle"></div>

<!-- MENU OVERLAY -->

<div class="timeline-overlay" id="timelineOverlay">

  <div class="timeline-wrap">

    <div class="timeline-list">

      <a href="bien.di(-)vong.lap.html" class="timeline-item">

        <div class="timeline-dot"></div>

        <div class="timeline-content">
          <div class="timeline-title">Biến dị<br>trong<br>vòng lặp</div>
        </div>

      </a>

    </div>

  </div>

</div>

<script>

const timelineToggle =
  document.getElementById('timelineToggle');

const timelineOverlay =
  document.getElementById('timelineOverlay');

timelineToggle.addEventListener('click', () => {
  timelineOverlay.classList.toggle('is-open');
});

timelineOverlay.addEventListener('click', (e) => {
  if (e.target === timelineOverlay) {
    timelineOverlay.classList.remove('is-open');
  }
});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bàn</title>

<!-- GLOBAL CSS -->
<link rel="stylesheet" href="../../style.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;600&family=Raleway+Dots&display=swap" rel="stylesheet">

<style>

/* ===== PAGE-SPECIFIC ONLY ===== */

.stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.circle {
  position: absolute;
  width: 440px;
  height: 440px;
  border-radius: 50%;
  border: 1px dashed rgba(255,255,255,0.25);
  box-shadow:
    0 0 12px rgba(255,255,255,0.08),
    0 0 24px rgba(255,255,255,0.04);
  animation: orbit 90s linear infinite;
}

.paragraph {
  max-width: 520px;
  text-align: center;
  opacity: 0;
  animation: bodyFade 1.2s ease forwards;
  animation-delay: 0.6s;
}

.center-bold {
  display: block;
  margin-top: 1.5rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-shadow: var(--glow-white);
  opacity: 0;
  animation: bodyFade 1s ease forwards;
  animation-delay: 1.8s;
}

/* INPUT */
.input {
  position: fixed;
  bottom: 12%;
  left: 50%;
  transform: translateX(-50%);
  width: 280px;
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(255,214,98,0.4);
  color: var(--white-accent);
  font-family: 'Raleway', sans-serif;
  font-weight: 100;
  font-size: 1rem;
  text-align: center;
  padding: 6px;
  outline: none;
  opacity: 0;
  animation: bodyFade 1s ease forwards;
  animation-delay: 2.4s;
}

.input::placeholder {
  color: rgba(255,255,255,0.35);
}

.input:focus {
  border-bottom: 1px solid var(--gold-core);
  box-shadow: 0 0 8px var(--gold-bloom);
}

/* ORBIT */
.orbit {
  position: absolute;
  width: 520px;
  height: 520px;
  animation: orbit 30s linear infinite;
}

.response {
  position: absolute;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1px dashed var(--gold-core);
  box-shadow:
    0 0 6px var(--gold-core),
    0 0 14px var(--gold-bloom);
  cursor: pointer;
}

/* Make toggle bigger */
.timeline-toggle {
  width: 100px;
  height: 100px;
}

/* Fade */
@keyframes bodyFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

</style>
</head>

<body>

<div class="work-title">
  <h1>Bàn</h1>
</div>

<div class="stage">

  <div class="circle"></div>

  <div class="paragraph body-text">
    You think understanding something means you’ve faced it.
    But most of the time, you’ve only found a way to explain it without feeling it.
    That’s not clarity. That’s distance.

    <span class="center-bold">Bạn nghĩ sao?</span>
  </div>

  <div class="orbit" id="orbit"></div>

</div>

<input id="input" class="input" placeholder="Bạn nghĩ sao?" />

<!-- REUSED OVERLAY SYSTEM -->
<div class="timeline-overlay" id="overlay">
  <div class="timeline-wrap">
    <div class="timeline-list" id="responseDisplay"></div>
  </div>
</div>

<div class="timeline-toggle" id="toggle"></div>

<script>

const input = document.getElementById("input");
const orbit = document.getElementById("orbit");
const overlay = document.getElementById("overlay");
const toggle = document.getElementById("toggle");
const display = document.getElementById("responseDisplay");

// LOAD
let responses = JSON.parse(localStorage.getItem("ban_responses")) || [];

// CREATE NODE
function createNode(text) {
  const angle = Math.random() * Math.PI * 2;
  const radius = 220;

  const x = 260 + radius * Math.cos(angle);
  const y = 260 + radius * Math.sin(angle);

  const node = document.createElement("div");
  node.className = "response";
  node.style.left = x + "px";
  node.style.top = y + "px";

  node.onclick = () => {
    overlay.classList.add("is-open");
    renderOverlay();
  };

  orbit.appendChild(node);
}

// RENDER OVERLAY
function renderOverlay() {
  display.innerHTML = "";

  responses.forEach(text => {
    const item = document.createElement("div");
    item.className = "timeline-item";

    item.innerHTML = `
      <div class="timeline-dot"></div>
      <div class="timeline-content">
        <div class="timeline-title">${text}</div>
      </div>
    `;

    display.appendChild(item);
  });
}

// INITIAL LOAD
responses.forEach(createNode);
renderOverlay();

// INPUT
input.addEventListener("keydown", function(e) {
  if (e.key === "Enter" && input.value.trim() !== "") {
    const text = input.value.trim();

    responses.push(text);
    localStorage.setItem("ban_responses", JSON.stringify(responses));

    createNode(text);
    renderOverlay();

    input.value = "";
  }
});

// TOGGLE OVERLAY
toggle.onclick = () => {
  overlay.classList.toggle("is-open");
};

// ADMIN DELETE (hidden)
document.addEventListener("keydown", function(e) {
  if (e.ctrlKey && e.key === "x") {
    localStorage.removeItem("ban_responses");
    location.reload();
  }
});

</script>

</body>
</html>

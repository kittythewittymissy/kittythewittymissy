<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bàn</title>

<link rel="icon" href="../../favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="../../favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../favicon/apple-touch-icon.png">
<link rel="manifest" href="favicon/site.webmanifest">

<link rel="stylesheet" href="../../style.css">

<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;600&family=Raleway+Dots&family=Codystar:wght@300;400;500&display=swap&subset=vietnamese" rel="stylesheet">

<style>

/* ===== PAGE-SPECIFIC ONLY ===== */

.stage {
  position: fixed;
  inset: 0;
}

/* ===== CIRCLE (BRIGHTER TABLE) ===== */

.circle {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 440px;
  height: 440px;
  border-radius: 50%;
  border: 1px dashed rgba(255,255,255,0.45);
  box-shadow:
    0 0 18px rgba(255,255,255,0.18),
    0 0 38px rgba(255,255,255,0.12),
    0 0 70px rgba(255,214,98,0.18);
  animation: orbit 90s linear infinite;
  z-index: 1;
}

/* ===== TITLE (MATCH MODEL: TOP LEFT DESKTOP, CENTER MOBILE) ===== */

.work-title {
  position: fixed;
  top: 2rem;
  left: 3rem;
  transform: none;
  z-index: 20;
  text-align: left;
}

.work-title h1 {
  font-family: 'Raleway Dots', sans-serif;
  font-size: 4.5rem;
  font-weight: 100;
  letter-spacing: 0.18em;
  color: var(--gold-core);
  text-shadow:
    0 0 4px var(--gold-core),
    0 0 10px rgba(255,214,98,0.75),
    0 0 18px rgba(255,214,98,0.5);
  opacity: 0;
  animation: neonSign-Gold 1.2s ease forwards;
  animation-delay: 0.3s;
}

/* ===== CENTER TEXT ===== */

.paragraph {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  max-width: 520px;
  text-align: center;
  font-size: 1.25rem;
  opacity: 0;
  z-index: 10;
  animation: bodyFade 1.2s ease forwards;
  animation-delay: 0.6s;
}

/* ===== ORBIT ===== */

.orbit {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 520px;
  height: 520px;
  animation: orbit 30s linear infinite;
  z-index: 0;
}

/* ===== FADE ===== */

@keyframes bodyFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ===== TIMELINE MENU ===== */

.vertical-menu {
  justify-content: center;
  padding: 0 4rem;
}

.vertical-menu .timeline-list {
  flex-direction: row;
  gap: 5rem;
}

.vertical-menu .timeline-item {
  position: relative;
  min-width: 220px;
  padding: 6rem 0;
  display: flex;
  justify-content: center;
  text-decoration: none;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

.vertical-menu .timeline-item:hover {
  transform: translateY(-6px);
}

.vertical-menu .timeline-dot {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 18px;
  height: 18px;
}

.vertical-menu .timeline-content {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 220px;
  text-align: center;
}

/* ===== MOBILE FIX: DOT BEFORE TEXT ===== */

@media(max-width:768px) {

  .circle {
    width: 300px;
    height: 300px;
  }

  .orbit {
    width: 360px;
    height: 360px;
  }

  .work-title {
    top: 12%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    width: 100%;
  }

  .work-title h1 {
    font-size: 3rem;
    text-align: center;
  }

  .paragraph {
    max-width: 88%;
    font-size: 1.05rem;
    line-height: 1.8;
  }

  .vertical-menu .timeline-list {
    flex-direction: column;
    gap: 2.6rem;
  }

  .vertical-menu .timeline-item {
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
  }

  /* FIX ORDER: DOT BEFORE TEXT */
  .vertical-menu .timeline-dot {
    position: relative;
    left: auto;
    top: auto;
    transform: none;
    margin-right: 1.3rem;
    order: 0;
  }

  .vertical-menu .timeline-content {
    position: relative;
    transform: none;
    width: auto;
    text-align: left;
    order: 1;
  }

  .timeline-toggle {
    width: 56px;
    height: 56px;
    right: 1rem;
    bottom: 5rem;
  }

  .back-button {
    top: 1rem;
    right: 1rem;
  }

  .back-button .kitty-text {
    font-size: 2rem;
  }

  .back-button .back-text {
    font-size: 1rem;
  }
}

</style>
</head>

<body>

<a href="../../index.html" class="back-button">
  <span class="back-text">Back to</span>
  <span class="kitty-text">Kitty</span>
</a>

<div class="stage">

  <div class="circle"></div>

  <div class="work-title">
    <h1>Bàn</h1>
  </div>

  <div class="paragraph body-text">
    Ta vào bàn, để bàn.
  </div>

  <div class="orbit"></div>

</div>

<div class="timeline-overlay" id="timelineOverlay">

  <div class="timeline-wrap vertical-menu">

    <div class="timeline-list">

      <a href="topic-1.html" class="timeline-item">
        <div class="timeline-content">
          <div class="timeline-title">Ý thức</div>
        </div>
        <div class="timeline-dot"></div>
      </a>

      <a href="topic-2.html" class="timeline-item">
        <div class="timeline-content">
          <div class="timeline-title">Tự do</div>
        </div>
        <div class="timeline-dot"></div>
      </a>

      <a href="topic-3.html" class="timeline-item">
        <div class="timeline-content">
          <div class="timeline-title">Cái đẹp</div>
        </div>
        <div class="timeline-dot"></div>
      </a>

    </div>

  </div>

</div>

<div class="timeline-toggle" id="timelineToggle"></div>

<script>

const timelineToggle = document.getElementById('timelineToggle');
const timelineOverlay = document.getElementById('timelineOverlay');

timelineToggle.addEventListener('click', () => {
  timelineOverlay.classList.toggle('is-open');
});

timelineOverlay.addEventListener('click', (e) => {
  if (e.target === timelineOverlay) {
    timelineOverlay.classList.remove('is-open');
  }
});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- VIEWPORT LOCK -->
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               minimum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>Bàn</title>

<link rel="icon" href="../../favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="../../favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../favicon/apple-touch-icon.png">
<link rel="manifest" href="favicon/site.webmanifest">

<link rel="stylesheet" href="../../style.css">

<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;600&family=Raleway+Dots&family=Codystar:wght@300;400;500&display=swap&subset=vietnamese" rel="stylesheet">

<style>

/* ===== HARD RESET ===== */

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

/* ===== STAGE ===== */

.stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

/* ===== ORBIT ===== */

.orbit {
  position: absolute;
  top: 50%;
  left: 50%;

  width: 520px;
  height: 520px;

  transform: translate(-50%, -50%);
  border-radius: 50%;

  z-index: 1;
  pointer-events: none;

  animation:
    orbitRotate 30s linear infinite,
    orbitPulse 6s ease-in-out infinite;
}

/* ===== ORBIT VISUAL ===== */

.orbit::before,
.orbit::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
}

.orbit::before {
  border: 1px solid rgba(255,255,255,0.9);
  box-shadow:
    0 0 8px rgba(255,255,255,0.9),
    0 0 18px rgba(255,255,255,0.8),
    0 0 36px rgba(255,255,255,0.5);
}

.orbit::after {
  inset: 28px;
  border: 1px solid rgba(255,255,255,0.45);
  box-shadow:
    0 0 10px rgba(255,255,255,0.5),
    inset 0 0 18px rgba(255,255,255,0.35);
}

/* ===== CENTER TEXT PLANE ===== */

.centerpiece {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 3;
  pointer-events: none;
  text-align: center;
}

.centerpiece h2 {
  margin: 0;
  font-family: 'Raleway', sans-serif;
  font-size: 2rem;
  font-weight: 200;
  letter-spacing: 0.3em;
  color: #fff;

  text-shadow:
    0 0 6px rgba(255,255,255,0.95),
    0 0 12px rgba(255,255,255,0.8),
    0 0 24px rgba(255,255,255,0.6),
    0 0 40px rgba(255,255,255,0.35);
}

/* ===== TITLE ===== */

.work-title {
  position: absolute;
  top: 0;
  left: 0;
  padding: 2rem 5rem;
  z-index: 5;
}

.work-title h1 {
  margin: 0;
  font-family: 'Raleway Dots', sans-serif;
  font-size: 4rem;
  letter-spacing: 0.16em;
  font-weight: 100;
  color: #222;

  text-shadow:
    0 0 1px var(--gold-core),
    0 0 2px var(--gold-core),
    0 0 4px var(--gold-core);

  opacity: 0;
  animation: neonSign-Gold 1.2s ease forwards;
  animation-delay: 0.3s;
}

/* ===== ANIMATIONS ===== */

@keyframes orbitRotate {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to   { transform: translate(-50%, -50%) rotate(360deg); }
}

@keyframes orbitPulse {
  0%,100% { opacity: 0.85; }
  50%     { opacity: 1; }
}

@keyframes neonSign-Gold {
  0%   { opacity:0; color:#222; text-shadow:none; }
  8%   { opacity:1; color:var(--gold-core); text-shadow:0 0 3px var(--gold-core); }
  16%  { opacity:0; color:#222; text-shadow:none; }
  25%  { opacity:1; color:var(--gold-core); text-shadow:0 0 6px var(--gold-core),0 0 10px rgba(255,214,98,0.7); }
  50%  { opacity:1; color:#fff; text-shadow:0 0 10px #fff,0 0 18px var(--gold-core); }
  66%  { opacity:1; color:var(--gold-core); text-shadow:0 0 6px var(--gold-core),0 0 12px rgba(255,214,98,0.8); }
  83%  { opacity:0.6; color:#222; text-shadow:none; }
  92%  { opacity:1; color:var(--gold-core); text-shadow:0 0 4px var(--gold-core),0 0 12px rgba(255,214,98,0.7); }
  100% { opacity:1; color:var(--gold-core); text-shadow:0 0 2px var(--gold-core),0 0 6px var(--gold-core),0 0 12px rgba(255,214,98,0.8),0 0 16px rgba(255,214,98,0.6); }
}

/* ===== TIMELINE ===== */

.vertical-menu .timeline-list {
  flex-direction: row;
  gap: 5rem;
}

.vertical-menu .timeline-item {
  position: relative;
  min-width: 220px;
  padding: 6rem 0;
  display: flex;
  justify-content: center;
}

/* ===== MOBILE ===== */

@media(max-width:768px) {

  .orbit {
    width: 360px;
    height: 360px;
  }

  .centerpiece h2 {
    font-size: 1.2rem;
    letter-spacing: 0.2em;
  }

  .work-title {
    left: 50%;
    transform: translateX(-50%);
    padding: 2rem 0;
    text-align: center;
  }

  .work-title h1 {
    font-size: 3rem;
  }

  .vertical-menu .timeline-list {
    flex-direction: column;
  }

  .vertical-menu .timeline-item {
    flex-direction: row;
    align-items: center;
  }

  .vertical-menu .timeline-dot {
    position: relative;
    order: 0;
    margin-right: 1rem;
  }

  .vertical-menu .timeline-content {
    position: relative;
    order: 1;
  }
}

</style>
</head>

<body>

<a href="../../index.html" class="back-button">
  <span class="back-text">Back to</span>
  <span class="kitty-text">Kitty</span>
</a>

<div class="stage">

  <div class="orbit"></div>

  <div class="centerpiece">
    <h2>BÀN</h2>
  </div>

  <div class="work-title">
    <h1>Bàn</h1>
  </div>

</div>

<div class="timeline-overlay" id="timelineOverlay">

  <div class="timeline-wrap vertical-menu">

    <div class="timeline-list">

      <a href="topic-1.html" class="timeline-item">
        <div class="timeline-content"><div class="timeline-title">Ý thức</div></div>
        <div class="timeline-dot"></div>
      </a>

      <a href="topic-2.html" class="timeline-item">
        <div class="timeline-content"><div class="timeline-title">Tự do</div></div>
        <div class="timeline-dot"></div>
      </a>

      <a href="topic-3.html" class="timeline-item">
        <div class="timeline-content"><div class="timeline-title">Cái đẹp</div></div>
        <div class="timeline-dot"></div>
      </a>

    </div>

  </div>

</div>

<div class="timeline-toggle" id="timelineToggle"></div>

<script>
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());

const timelineToggle = document.getElementById('timelineToggle');
const timelineOverlay = document.getElementById('timelineOverlay');

timelineToggle.addEventListener('click', () => {
  timelineOverlay.classList.toggle('is-open');
});

timelineOverlay.addEventListener('click', (e) => {
  if (e.target === timelineOverlay) {
    timelineOverlay.classList.remove('is-open');
  }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bàn</title>

<!-- GLOBAL CSS -->
<link rel="stylesheet" href="../../style.css">

<!-- Google Fonts (keep only if not globally loaded) -->
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;600&family=Raleway+Dots&display=swap" rel="stylesheet">

<style>

/* ===== PAGE-SPECIFIC ONLY ===== */

/* Stage layout */
.stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Circle uses your global orbit animation */
.circle {
  position: absolute;
  width: 440px;
  height: 440px;
  border-radius: 50%;
  border: 1px dashed rgba(255,255,255,0.25);

  box-shadow:
    0 0 12px rgba(255,255,255,0.08),
    0 0 24px rgba(255,255,255,0.04);

  animation: orbit 90s linear infinite; /* reuse global */
}

/* Paragraph → extend global body-text */
.paragraph {
  max-width: 520px;
  text-align: center;

  opacity: 0;
  animation: bodyFade 1.2s ease forwards;
  animation-delay: 0.6s;
}

/* Question emphasis */
.center-bold {
  display: block;
  margin-top: 1.5rem;

  font-weight: 600;
  letter-spacing: 0.05em;

  text-shadow: var(--glow-white);

  opacity: 0;
  animation: bodyFade 1s ease forwards;
  animation-delay: 1.8s;
}

/* Input */
.input {
  position: fixed;
  bottom: 12%;
  left: 50%;
  transform: translateX(-50%);

  width: 280px;
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(255,214,98,0.4);

  color: var(--white-accent);
  font-family: 'Raleway', sans-serif;
  font-weight: 100;
  font-size: 1rem;
  text-align: center;

  padding: 6px;
  outline: none;

  opacity: 0;
  animation: bodyFade 1s ease forwards;
  animation-delay: 2.4s;
}

.input::placeholder {
  color: rgba(255,255,255,0.35);
}

.input:focus {
  border-bottom: 1px solid var(--gold-core);
  box-shadow: 0 0 8px var(--gold-bloom);
}

/* Orbit system */
.orbit {
  position: absolute;
  width: 520px;
  height: 520px;
  animation: orbit 30s linear infinite;
}

/* Response nodes (aligned with timeline dot style) */
.response {
  position: absolute;
  width: 22px;
  height: 22px;
  border-radius: 50%;

  border: 1px dashed var(--gold-core);

  box-shadow:
    0 0 6px var(--gold-core),
    0 0 14px var(--gold-bloom);

  cursor: pointer;
}

/* Fade */
@keyframes bodyFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

</style>
</head>

<body>

<div class="work-title">
  <h1>Bàn</h1>
</div>

<div class="stage">

  <div class="circle"></div>

  <div class="paragraph body-text">
    You think understanding something means you’ve faced it.
    But most of the time, you’ve only found a way to explain it without feeling it.
    That’s not clarity. That’s distance.

    <span class="center-bold">Bạn nghĩ sao?</span>
  </div>

  <div class="orbit" id="orbit"></div>

</div>

<input id="input" class="input" placeholder="Bạn nghĩ sao?" />

<script>

const input = document.getElementById("input");
const orbit = document.getElementById("orbit");

// LOAD SAVED RESPONSES
let responses = JSON.parse(localStorage.getItem("ban_responses")) || [];

// CREATE NODE
function createNode(text) {
  const angle = Math.random() * Math.PI * 2;
  const radius = 220;

  const x = 260 + radius * Math.cos(angle);
  const y = 260 + radius * Math.sin(angle);

  const node = document.createElement("div");
  node.className = "response";
  node.style.left = x + "px";
  node.style.top = y + "px";

  node.onclick = () => {
    input.value = text; // cleaner interaction
  };

  orbit.appendChild(node);
}

// RENDER EXISTING
responses.forEach(createNode);

// INPUT HANDLER
input.addEventListener("keydown", function(e) {
  if (e.key === "Enter" && input.value.trim() !== "") {
    const text = input.value.trim();

    responses.push(text);
    localStorage.setItem("ban_responses", JSON.stringify(responses));

    createNode(text);

    input.value = "";
  }
});

</script>

</body>
</html

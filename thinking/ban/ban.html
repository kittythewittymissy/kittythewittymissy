<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bàn</title>

<!-- Favicon -->
<link rel="icon" href="../../favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="../../favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../favicon/apple-touch-icon.png">
<link rel="manifest" href="favicon/site.webmanifest">

<!-- GLOBAL CSS -->
<link rel="stylesheet" href="../../style.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;600&family=Raleway+Dots&family=Codystar:wght@300;400;500&display=swap&subset=vietnamese" rel="stylesheet">

<style>

/* ===== PAGE-SPECIFIC ONLY ===== */

.stage {
  position: fixed;
  inset: 0;
}

/* ===== CIRCLE ===== */

.circle {
  position: absolute;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  width: 440px;
  height: 440px;

  border-radius: 50%;

  border: 1px dashed rgba(255,255,255,0.42);

  box-shadow:
    0 0 16px rgba(255,255,255,0.14),
    0 0 36px rgba(255,255,255,0.08),
    0 0 64px rgba(255,255,255,0.04);

  animation: orbit 90s linear infinite;
}

/* ===== TITLE ===== */

.work-title {
  position: absolute;

  top: 14%;
  left: 50%;

  transform: translateX(-50%);

  z-index: 20;

  text-align: center;
}

.work-title h1 {
  font-family: 'Raleway Dots', sans-serif;

  z-index: 1;

  font-size: 4rem;

  letter-spacing: 0.16em;

  font-weight: 100;

  color: #222;

  text-shadow:
    0 0 1px var(--gold-core),
    0 0 2px var(--gold-core),
    0 0 4px var(--gold-core);

  opacity: 0;

  animation: neonSign-Gold 1.2s ease forwards;
  animation-delay: 0.3s;
}

@keyframes neonSign-Gold {

  0% {
    opacity: 0;
    color: #222;
    text-shadow: none;
  }

  8% {
    opacity: 1;
    color: var(--gold-core);
    text-shadow: 0 0 3px var(--gold-core);
  }

  16% {
    opacity: 0;
    color: #222;
    text-shadow: none;
  }

  25% {
    opacity: 1;

    text-shadow:
      0 0 6px var(--gold-core),
      0 0 10px rgba(255,214,98,0.7);
  }

  50% {
    opacity: 1;

    color: #fff;

    text-shadow:
      0 0 10px #fff,
      0 0 18px var(--gold-core);
  }

  66% {
    opacity: 1;

    color: var(--gold-core);

    text-shadow:
      0 0 6px var(--gold-core),
      0 0 12px rgba(255,214,98,0.8);
  }

  83% {
    opacity: 0.6;
    color: #222;
    text-shadow: none;
  }

  92% {
    opacity: 1;

    color: var(--gold-core);

    text-shadow:
      0 0 4px var(--gold-core),
      0 0 12px rgba(255,214,98,0.7);
  }

  100% {
    opacity: 1;

    color: var(--gold-core);

    text-shadow:
      0 0 2px var(--gold-core),
      0 0 6px var(--gold-core),
      0 0 12px rgba(255,214,98,0.8),
      0 0 16px rgba(255,214,98,0.6);
  }
}

/* ===== CENTER TEXT ===== */

.paragraph {
  position: absolute;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  max-width: 520px;

  text-align: center;

  font-size: 1.25rem;

  opacity: 0;

  z-index: 5;

  animation: bodyFade 1.2s ease forwards;
  animation-delay: 0.6s;
}

/* ===== ORBIT ===== */

.orbit {
  position: absolute;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  width: 520px;
  height: 520px;

  animation: orbit 30s linear infinite;
}

/* ===== FADE ===== */

@keyframes bodyFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* =========================
   TIMELINE MENU
========================= */

/* DESKTOP = HORIZONTAL */

.vertical-menu {
  justify-content: center;
  padding: 0 4rem;
}

.vertical-menu .timeline-list {
  flex-direction: row;
  gap: 5rem;
}

.vertical-menu .timeline-item {
  position: relative;

  min-width: 220px;

  padding: 6rem 0;

  display: flex;
  justify-content: center;

  text-decoration: none;

  transition:
    transform 0.25s ease,
    opacity 0.25s ease;
}

.vertical-menu .timeline-item:hover {
  transform: translateY(-6px);
}

.vertical-menu .timeline-dot {
  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  width: 18px;
  height: 18px;
}

.vertical-menu .timeline-content {
  position: absolute;

  left: 50%;

  transform: translateX(-50%);

  width: 220px;

  text-align: center;
}

.vertical-menu .timeline-item:nth-child(odd) .timeline-content {
  bottom: calc(50% + 4rem);
}

.vertical-menu .timeline-item:nth-child(even) .timeline-content {
  top: calc(50% + 4rem);
}

.vertical-menu .timeline-title {
  font-size: 2rem;
  letter-spacing: 0.12em;
}

.vertical-menu .timeline-item:hover .timeline-title {
  color: var(--gold-core);

  text-shadow:
    0 0 6px var(--gold-core),
    0 0 16px var(--gold-bloom);
}

/* ===== TOGGLE ===== */

.timeline-toggle {
  z-index: 1200;
}

/* make button visible over overlay */

.timeline-overlay.is-open + .timeline-toggle,
.timeline-toggle {
  opacity: 1 !important;
}

/* ===== MOBILE ===== */

@media(max-width:768px) {

  .circle {
    width: 300px;
    height: 300px;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);
  }

  .orbit {
    width: 360px;
    height: 360px;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);
  }

  .work-title {
    top: 12%;
    width: 100%;
  }

  .work-title h1 {
    font-family: 'Raleway Dots', sans-serif;

    font-size: 2.8rem;

    line-height: 1.2;

    letter-spacing: 0.16em;

    font-weight: 100;

    -webkit-text-stroke: 0;

    text-shadow:
      0 0 4px var(--gold-core),
      0 0 10px rgba(255,214,98,0.85),
      0 0 18px rgba(255,214,98,0.55);
  }

  .paragraph {
    max-width: 88%;

    font-size: 1.05rem;
    line-height: 1.8;
  }

  /* MOBILE = VERTICAL */

  .vertical-menu .timeline-list {
    flex-direction: column;
    gap: 2.6rem;
  }

  .vertical-menu .timeline-item {
    min-width: auto;
    padding: 0;

    display: flex;
    align-items: center;
    justify-content: flex-start;
  }

  .vertical-menu .timeline-dot {
    position: relative;

    order: 0;

    left: auto;
    top: auto;

    transform: none;

    margin-right: 1.3rem;

    width: 16px;
    height: 16px;
  }

  .vertical-menu .timeline-content {
    position: relative;

    order: 1;

    left: auto;
    top: auto;
    bottom: auto;

    transform: none;

    width: auto;

    text-align: left;
  }

  .vertical-menu .timeline-title {
    font-size: 1.75rem;
    letter-spacing: 0.1em;
  }

  .timeline-toggle {
    width: 56px;
    height: 56px;

    right: 1rem;
    bottom: 5rem;
  }

  .back-button {
    top: 1rem;
    right: 1rem;
  }

  .back-button .kitty-text {
    font-size: 2rem;
  }

  .back-button .back-text {
    font-size: 1rem;
  }
}

</style>
</head>

<body>

<!-- BACK BUTTON -->

<a href="../../index.html" class="back-button">
  <span class="back-text">Back to</span>
  <span class="kitty-text">Kitty</span>
</a>

<!-- MAIN STAGE -->

<div class="stage">

  <div class="circle"></div>

  <div class="work-title">
    <h1>Bàn</h1>
  </div>

  <div class="paragraph body-text">
    Ta vào bàn, để bàn.
  </div>

  <div class="orbit"></div>

</div>

<!-- MENU OVERLAY -->

<div class="timeline-overlay" id="timelineOverlay">

  <div class="timeline-wrap vertical-menu">

    <div class="timeline-list">

      <a href="topic-1.html" class="timeline-item">

        <div class="timeline-content">
          <div class="timeline-title">Ý thức</div>
        </div>

        <div class="timeline-dot"></div>

      </a>

      <a href="topic-2.html" class="timeline-item">

        <div class="timeline-content">
          <div class="timeline-title">Tự do</div>
        </div>

        <div class="timeline-dot"></div>

      </a>

      <a href="topic-3.html" class="timeline-item">

        <div class="timeline-content">
          <div class="timeline-title">Cái đẹp</div>
        </div>

        <div class="timeline-dot"></div>

      </a>

    </div>

  </div>

</div>

<!-- TOGGLE BUTTON -->

<div class="timeline-toggle" id="timelineToggle"></div>

<script>

/* ===== TIMELINE MENU ===== */

const timelineToggle = document.getElementById('timelineToggle');

const timelineOverlay = document.getElementById('timelineOverlay');

timelineToggle.addEventListener('click', () => {

  timelineOverlay.classList.toggle('is-open');

});

timelineOverlay.addEventListener('click', (e) => {

  if (e.target === timelineOverlay) {
    timelineOverlay.classList.remove('is-open');
  }

});

</script>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bàn</title>

<!-- Favicon -->
<link rel="icon" href="../../favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="../../favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../favicon/apple-touch-icon.png">
<link rel="manifest" href="favicon/site.webmanifest">
  
<!-- GLOBAL CSS -->
<link rel="stylesheet" href="../../style.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;600&family=Raleway+Dots&family=Codystar:wght@300;400;500&display=swap&subset=vietnamese" rel="stylesheet">

<style>

/* ===== PAGE-SPECIFIC ONLY ===== */

.stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.circle {
  position: absolute;
  width: 440px;
  height: 440px;
  border-radius: 50%;
  border: 1px dashed rgba(255,255,255,0.45);
  box-shadow:
    0 0 12px rgba(255,255,255,0.16),
    0 0 24px rgba(255,255,255,0.09);
  animation: orbit 90s linear infinite;
}

.work-title { 
  position: relative;
  top: auto;
  left: auto;
  padding: 2rem 5rem;
}

.paragraph {
  max-width: 520px;
  margin: 0 auto;
  text-align: center;
  font-size: 1.25rem;
  opacity: 0;
  animation: bodyFade 1.2s ease forwards;
  animation-delay: 0.6s;
}

.center-bold {
  display: block;
  margin-top: 1rem;
  font-weight: 600;
  font-size: 1.4rem;
  letter-spacing: 0.05em;
  text-shadow: var(--glow-white);
  opacity: 0;
  animation: bodyFade 1s ease forwards;
  animation-delay: 1.8s;
}

/* INPUT */
.input {
  position: fixed;
  bottom: 12%;
  left: 50%;
  transform: translateX(-50%);
  width: 280px;
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(255,214,98,0.4);
  color: var(--white-accent);
  font-family: 'Raleway', sans-serif;
  font-weight: 100;
  font-size: 1rem;
  text-align: center;
  padding: 6px;
  outline: none;
  opacity: 0;
  animation: bodyFade 1s ease forwards;
  animation-delay: 2.4s;
}

.input::placeholder {
  color: rgba(255,255,255,0.35);
}

.input:focus {
  border-bottom: 1px solid var(--gold-core);
  box-shadow: 0 0 8px var(--gold-bloom);
}

/* ORBIT */
.orbit {
  position: absolute;
  width: 520px;
  height: 520px;
  animation: orbit 30s linear infinite;
}

.response {
  position: absolute;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1px dashed var(--gold-core);
  box-shadow:
    0 0 6px var(--gold-core),
    0 0 14px var(--gold-bloom);
  cursor: pointer;

  opacity: 0;
  transform: translate(-50%, -50%) scale(0.6);
  transition: opacity 0.6s ease, transform 0.6s ease;
}

.response.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

/* CENTERED OVERLAY TEXT */
#singleResponse {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  max-width: 700px;
  text-align: center;

  font-size: 1.8rem;
  font-weight: 200;
  line-height: 1.8;
}

/* Fade */
@keyframes bodyFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ===== TOPIC LIST ===== */

.timeline-wrap {
  position: fixed;
  right: 3.5rem;
  top: 50%;
  transform: translateY(-50%);

  height: auto;
  padding: 0;
  overflow: visible;
}

/* vertical stack */
.timeline-list {
  flex-direction: column;
  gap: 2.5rem;
}

.timeline-item {
  padding: 0;
  min-width: auto;
  display: flex;
  align-items: center;
  justify-content: flex-start;
}

.timeline-dot {
  order: 1;
  position: relative;
  left: auto;
  top: auto;
  transform: none;
  margin-left: 1rem;
  align-self: center; 
  z-index: 1;
  width: 14px;
  height: 14px;
}

.timeline-content {
  position: relative;
  left: auto;
  transform: none;
  width: auto;
  text-align: left;
}

/* remove alternating top/bottom logic */
.timeline-item:nth-child(odd) .timeline-content,
.timeline-item:nth-child(even) .timeline-content {
  top: auto;
  bottom: auto;
}

/* clickable */
.timeline-item {
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.25s ease;
}

.timeline-item:hover {
  transform: translateX(-6px);
}

/* subtle hover emphasis */
.timeline-item:hover .timeline-title {
  color: var(--gold-core);
  text-shadow:
    0 0 6px var(--gold-core),
    0 0 16px var(--gold-bloom);
}

</style>
</head>

<body>

<div class="work-title">
  <h1>Bàn</h1>
</div>

<a href="../../index.html" class="back-button">
  <span class="back-text">Back to</span>
  <span class="kitty-text">Kitty</span>
</a>

<div class="stage">

  <div class="circle"></div>

  <div class="paragraph body-text">
    Ta vào bàn, để bàn.

    <span class="center-bold">Hãy nói.</span>
  </div>

  <div class="orbit" id="orbit"></div>

  <div class="timeline-wrap">

  <div class="timeline-list">

    <a href="topic-1.html" class="timeline-item">
      <div class="timeline-dot"></div>
      <div class="timeline-content">
        <div class="timeline-title">Ý thức</div>
      </div>
    </a>

    <a href="topic-2.html" class="timeline-item">
      <div class="timeline-dot"></div>
      <div class="timeline-content">
        <div class="timeline-title">Tự do</div>
      </div>
    </a>

    <a href="topic-3.html" class="timeline-item">
      <div class="timeline-dot"></div>
      <div class="timeline-content">
        <div class="timeline-title">Cái đẹp</div>
      </div>
    </a>

  </div>

</div>

</div>

<input id="input" class="input" placeholder="Bạn nghĩ sao?" />

<!-- SINGLE RESPONSE OVERLAY -->
<div class="timeline-overlay" id="overlay">
  <div id="singleResponse" class="body-text"></div>
</div>

<script>

const input = document.getElementById("input");
const orbit = document.getElementById("orbit");
const overlay = document.getElementById("overlay");
const display = document.getElementById("singleResponse");

// LOAD
let responses = JSON.parse(localStorage.getItem("ban_responses")) || [];

// CREATE NODE
function createNode(text) {
  const angle = Math.random() * Math.PI * 2;
  const radius = 220;

  const orbitSize = 520;
  const center = orbitSize / 2;

  const x = center + radius * Math.cos(angle);
  const y = center + radius * Math.sin(angle);

  const node = document.createElement("div");
  node.className = "response";
  node.style.left = x + "px";
  node.style.top = y + "px";

  let clickTimer = null;

  node.addEventListener("click", (e) => {
    if (e.shiftKey) {
      if (clickTimer) {
        clearTimeout(clickTimer);
        clickTimer = null;

        const index = responses.indexOf(text);
        if (index > -1) {
          responses.splice(index, 1);
          localStorage.setItem("ban_responses", JSON.stringify(responses));
          node.remove();
        }
      } else {
        clickTimer = setTimeout(() => {
          clickTimer = null;
        }, 250);
      }
    } else {
      overlay.classList.add("is-open");
      display.innerText = text;
    }
  });

  orbit.appendChild(node);

  // EASE-IN ANIMATION
  requestAnimationFrame(() => {
    node.classList.add("show");
  });
}

// INITIAL LOAD
responses.forEach(createNode);

// INPUT
input.addEventListener("keydown", function(e) {
  if (e.key === "Enter" && input.value.trim() !== "") {
    const text = input.value.trim();

    responses.push(text);
    localStorage.setItem("ban_responses", JSON.stringify(responses));

    createNode(text);

    input.value = "";
  }
});

// CLICK OVERLAY TO CLOSE
overlay.onclick = () => {
  overlay.classList.remove("is-open");
};

</script>

</body>
</html>

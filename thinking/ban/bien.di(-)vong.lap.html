<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Biến dị trong vòng lặp</title>

<!-- Favicon -->
<link rel="icon" href="../../favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="../../favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../favicon/apple-touch-icon.png">
<link rel="manifest" href="favicon/site.webmanifest">

<!-- GLOBAL CSS -->
<link rel="stylesheet" href="../../style.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;600&family=Raleway+Dots&family=Codystar:wght@300;400;500&display=swap&subset=vietnamese" rel="stylesheet">

<style>

/* ===== STAGE ===== */

.stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== OVAL TABLE ===== */
.oval-table {
position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 98vw;
  height: 89vh;
  border-radius: 50%;
  box-shadow:
      0 0 8px rgba(255,255,255,0.13),
      0 0 16px rgba(255,255,255,0.07);
  pointer-events: none;
  z-index: 0;
}

/* ===== TITLE ===== */

.work-title {
  position: absolute;
  left: 10rem;
  top: 50%;
  transform: translateY(-50%);
  width: auto;
  text-align: center;
  z-index: 4;
}

.work-title h1 {
  font-family: 'Raleway', sans-serif;
  font-size: 4rem;
  letter-spacing: 0.16em;
  font-weight: 100;
  color: #222;
  text-shadow:
    0 0 1px var(--gold-core),
    0 0 2px var(--gold-core),
    0 0 4px var(--gold-core);
  opacity: 0;
  animation: neonSign-Gold 1.2s ease forwards;
  animation-delay: 0.3s;
}

@keyframes neonSign-Gold {
  0%   { opacity:0; color:#222; text-shadow:none; }
  8%   { opacity:1; color:var(--gold-core); text-shadow:0 0 3px var(--gold-core); }
  16%  { opacity:0; color:#222; text-shadow:none; }
  25%  { opacity:1; color:var(--gold-core); text-shadow:0 0 6px var(--gold-core),0 0 10px rgba(255,214,98,0.7); }
  50%  { opacity:1; color:#fff; text-shadow:0 0 10px #fff,0 0 18px var(--gold-core); }
  66%  { opacity:1; color:var(--gold-core); text-shadow:0 0 6px var(--gold-core),0 0 12px rgba(255,214,98,0.8); }
  83%  { opacity:0.6; color:#222; text-shadow:none; }
  92%  { opacity:1; color:var(--gold-core); text-shadow:0 0 4px var(--gold-core),0 0 12px rgba(255,214,98,0.7); }
  100% { opacity:1; color:var(--gold-core); text-shadow:0 0 2px var(--gold-core),0 0 6px var(--gold-core),0 0 12px rgba(255,214,98,0.8),0 0 16px rgba(255,214,98,0.6); }
}

/* ===== TOPIC ===== */

.paragraph {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  max-width: 520px;
  text-align: center;
  font-size: 1.25rem;
  opacity: 0;
  animation: bodyFade 1.2s ease forwards;
  animation-delay: 0.6s;
  z-index: 3;
}

.center-bold {
  display: block;
  margin-top: 1rem;
  font-weight: 600;
  font-size: 1.4rem;
  letter-spacing: 0.05em;
  text-shadow: var(--glow-white);
  opacity: 0;
  animation: bodyFade 1s ease forwards;
  animation-delay: 1.8s;
}

/* ===== INPUT BOX ===== */

.input-wrap {
  position: fixed;
  bottom: 12%;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 0.6rem;
  opacity: 0;
  animation: bodyFade 1s ease forwards;
  animation-delay: 2.4s;
  z-index: 6;
}

.input {
  width: 280px;
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(255,214,98,0.4);
  color: var(--white-accent);
  font-family: 'Raleway', sans-serif;
  font-weight: 100;
  font-size: 1rem;
  text-align: center;
  padding: 6px;
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
}

.input::placeholder {
  color: rgba(255,255,255,0.35);
}

.input:focus {
  border-bottom: 1px solid var(--gold-core);
  box-shadow: 0 0 8px var(--gold-bloom);
}

/* ===== PLACE BUTTON ===== */

.place-btn {
  font-family: 'Raleway', sans-serif;
  font-size: 1.1rem;
  font-weight: normal;
  color: var(--white-accent);
  background: transparent;
  border: 1px solid rgba(255,214,98,0.35);
  border-radius: 50%;
  width: 42px;
  height: 42px;
  cursor: pointer;
  text-shadow:
    0 0 3px #fff,
    0 0 8px rgba(255,255,255,0.6),
    0 0 16px rgba(255,255,255,0.4);
  box-shadow:
    0 0 6px rgba(255,214,98,0.2),
    0 0 14px rgba(255,214,98,0.1);
  transition:
    text-shadow 0.3s,
    box-shadow 0.3s,
    border-color 0.3s,
    transform 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.place-btn:hover {
  color: var(--gold-core);
  text-shadow:
    0 0 4px var(--gold-core),
    0 0 10px var(--gold-bloom),
    0 0 20px rgba(255,214,98,0.5);
  border-color: var(--gold-core);
  box-shadow:
    0 0 10px var(--gold-core),
    0 0 22px var(--gold-bloom);
  transform: scale(1.05);
}

.place-btn:active {
  transform: scale(0.95);
}

/* ===== THOUGHT BUBBLE ===== */

.thought-bubble-wrap {
  position: fixed;
  right: 4rem;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.8rem;
  z-index: 5;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
  max-width: calc(100vw - 4rem - 440px - 2rem);
}

.thought-bubble-wrap.active {
  opacity: 1;
  pointer-events: auto;
}

.thought-bubble {
  min-width: 280px;
  max-width: 100%;
  min-height: 100px;
  max-height: 65vh;
  padding: 2rem 2.2rem;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,214,98,0.25);
  border-radius: 24px;
  color: var(--white-accent);
  font-family: 'Raleway', sans-serif;
  font-weight: 100;
  font-size: 1.1rem;
  line-height: 1.9;
  text-align: left;
  resize: none;
  outline: none;
  word-wrap: break-word;
  overflow-wrap: break-word;
  white-space: pre-wrap;
  overflow-y: auto;
  box-shadow:
    0 0 12px rgba(255,214,98,0.12),
    0 0 28px rgba(0,0,0,0.5);
}

.thought-bubble::placeholder {
  color: rgba(255,255,255,0.3);
}

/* Thought bubble tail */
.thought-bubble-wrap::before {
  content: "";
  position: absolute;
  top: 50%;
  left: -18px;
  transform: translateY(-50%);
  width: 0;
  height: 0;
  border-top: 10px solid transparent;
  border-bottom: 10px solid transparent;
  border-right: 18px solid rgba(255,214,98,0.25);
  pointer-events: none;
}

/* Place button inside bubble wrap */
.thought-bubble-wrap .place-btn {
  margin-right: 0.5rem;
}

/* ===== ORBIT ===== */

.orbit {
  position: relative;
  width: 440px;
  height: 440px;
  z-index: 2;
  animation: orbit 90s linear infinite;
}

.orbit::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px dashed rgba(255,255,255,0.36);
  box-shadow:
    0 0 10px rgba(255,255,255,0.20),
    0 0 20px rgba(255,255,255,0.11),
    0 0 40px rgba(255,255,255,0.045);
}

/* ===== RESPONSE ===== */

.response {
  position: absolute;
  z-index: 4;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--gold-core);
  box-shadow:
    0 0 6px var(--gold-core),
    0 0 16px var(--gold-core),
    0 0 36px var(--gold-bloom);
  opacity: 0;
  transform: translate(-50%, -50%);
  transition:
    opacity 0.4s ease,
    transform 0.4s ease;
  cursor: pointer;
}

.response.show {
  opacity: 1;
  transform: translate(-50%, -50%);
}

/* ===== CONTEXT MENU ===== */

.context-menu {
  position: fixed;
  z-index: 3000;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,214,98,0.3);
  border-radius: 8px;
  padding: 0.4rem 0;
  min-width: 180px;
  box-shadow:
    0 0 12px rgba(255,214,98,0.15),
    0 0 24px rgba(0,0,0,0.6);
  display: none;
}

.context-menu button {
  display: block;
  width: 100%;
  background: none;
  border: none;
  color: #fff;
  font-family: 'Raleway', sans-serif;
  font-weight: 100;
  font-size: 0.9rem;
  padding: 0.5rem 1.2rem;
  text-align: left;
  cursor: pointer;
  transition: background 0.2s, text-shadow 0.2s;
}

.context-menu button:hover {
  background: rgba(255,214,98,0.1);
  text-shadow:
    0 0 8px #fff,
    0 0 16px rgba(255,255,255,0.7);
}

.context-menu .divider {
  border-top: 1px solid rgba(255,214,98,0.2);
  margin: 0.2rem 0;
}

/* ===== CENTERED OVERLAY TEXT ===== */

#singleResponse {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  max-width: 540px;
  width: auto;
  text-align: center;
  font-size: 1.8rem;
  font-weight: 200;
  line-height: 1.8;
  word-break: break-word;
  overflow-wrap: break-word;
  white-space: normal;
  overflow-y: auto;
  max-height: 70vh;
  padding: 1.5rem;
}

/* ===== FADE ===== */

@keyframes bodyFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* TIMELINE TOGGLE */

.timeline-toggle {
  z-index: 2000;
  position: fixed;
}

/* ===== MOBILE ===== */

@media(max-width:768px) {

  .stage {
    padding: 2rem;
  }

  .oval-table {
    display: none;
  }

  .orbit {
    width: 360px;
    height: 360px;
  }

  .work-title {
    left: 50%;
    top: 25%;
    transform: translate(-50%, -50%);
    width: 90%;
    text-align: center;
  }

  .work-title h1 {
    font-size: 2.6rem;
    line-height: 1.2;
  }

  .paragraph {
    max-width: 88%;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    font-size: 1.05rem;
    line-height: 1.8;
  }

  .center-bold {
    font-size: 1.15rem;
  }

  .input-wrap {
    width: 85%;
    bottom: 10%;
  }

  .input {
    width: 100%;
    font-size: 0.95rem;
  }

  .thought-bubble-wrap {
    right: auto;
    left: 50%;
    top: auto;
    bottom: 20%;
    transform: translateX(-50%);
  }

  .thought-bubble {
    max-width: 85vw;
    min-width: 180px;
    font-size: 0.9rem;
    padding: 1rem 1.2rem;
  }

  .thought-bubble-wrap::before {
    top: auto;
    bottom: -16px;
    left: 50%;
    transform: translateX(-50%);
    border-right: 10px solid transparent;
    border-left: 10px solid transparent;
    border-top: 16px solid rgba(255,214,98,0.25);
    border-bottom: none;
  }

  .response {
    width: 16px;
    height: 16px;
  }

  #singleResponse {
    width: 82%;
    font-size: 1.2rem;
    line-height: 1.8;
  }

  .timeline-toggle {
    width: 56px;
    height: 56px;
    right: 1rem;
    bottom: 5rem;
  }

  .back-button {
    top: 1rem;
    right: 1rem;
  }

  .back-button .kitty-text {
    font-size: 2rem;
  }

  .back-button .back-text {
    font-size: 1rem;
  }
}

</style>
</head>

<body>

<!-- BACK BUTTON -->

<a href="ban.html" class="back-button">
  <span class="back-text">Back to</span>
  <span class="kitty-text">Bàn</span>
</a>

<!-- MAIN STAGE -->

<div class="stage">

  <div class="oval-table"></div>

  <div class="work-title">
    <h1>Biến dị
      <br>trong<br>
      vòng lặp</h1>
  </div>

  <div class="paragraph body-text">
    Trong mỗi vòng lặp,

    <span class="center-bold">
      một sai lệch nhỏ xảy ra.
    </span>
  </div>

  <div class="orbit" id="orbit"></div>

</div>

<!-- INPUT + PLACE BUTTON -->

<div class="input-wrap">
  <input id="input" class="input" placeholder="Bạn nghĩ sao?" />
  <button class="place-btn" id="placeBtn" title="Đặt">Đặt</button>
</div>

<!-- THOUGHT BUBBLE + PLACE BUTTON -->

<div class="thought-bubble-wrap" id="thoughtBubbleWrap">
  <textarea class="thought-bubble" id="thoughtBubble" placeholder="Tiếp tục gõ..."></textarea>
  <button class="place-btn" id="placeBtnBubble" title="Đặt">Đ</button>
</div>

<!-- TIMELINE TOGGLE -->

<div class="timeline-toggle" id="timelineToggle"></div>

<!-- RESPONSE OVERLAY -->

<div class="timeline-overlay" id="overlay">
  <div id="singleResponse" class="body-text"></div>
</div>

<!-- CONTEXT MENU -->

<div class="context-menu" id="contextMenu">
  <button id="ctxView">Xem</button>
  <div class="divider"></div>
  <button id="ctxEdit">Chỉnh sửa</button>
  <button id="ctxDetach">Gỡ khỏi quỹ đạo</button>
</div>

<!-- MENU OVERLAY -->

<div class="timeline-overlay" id="timelineOverlay">

  <div class="timeline-wrap">

    <div class="timeline-list">

      <a href="bien.di(-)vong.lap.html" class="timeline-item">

        <div class="timeline-dot"></div>

        <div class="timeline-content">
          <div class="timeline-title">Biến dị<br>trong<br>vòng lặp</div>
        </div>

      </a>

    </div>

  </div>

</div>

<script>

/* ===== SESSION FINGERPRINT ===== */

const FINGERPRINT_KEY = 'tdrb_user_fp';
let userFingerprint = sessionStorage.getItem(FINGERPRINT_KEY);
if (!userFingerprint) {
  userFingerprint = crypto.randomUUID();
  sessionStorage.setItem(FINGERPRINT_KEY, userFingerprint);
}

const ADMIN_TOKEN = 'tdrb_admin_2026';
let isAdmin = sessionStorage.getItem('tdrb_admin') === ADMIN_TOKEN;

/* ===== DOM REFERENCES ===== */

const input = document.getElementById("input");
const orbit = document.getElementById("orbit");
const overlay = document.getElementById("overlay");
const display = document.getElementById("singleResponse");
const contextMenu = document.getElementById("contextMenu");
const thoughtBubble = document.getElementById("thoughtBubble");
const thoughtBubbleWrap = document.getElementById("thoughtBubbleWrap");
const placeBtn = document.getElementById("placeBtn");
const placeBtnBubble = document.getElementById("placeBtnBubble");

/* ===== STATE ===== */

const STORAGE_KEY = "tdrb_fragments";
let fragments = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
let activeContextFragment = null;
let bubbleTimeout = null;

/* ===== HELPERS ===== */

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(fragments));
}

function submitFragment(text) {
  const trimmed = text.trim();
  if (trimmed === "") return;

  const fragment = {
    id: crypto.randomUUID(),
    text: trimmed,
    createdBy: userFingerprint,
    createdAt: Date.now()
  };

  fragments.push(fragment);
  save();
  createNode(fragment);

  // Reset
  input.value = "";
  thoughtBubble.value = "";
  thoughtBubbleWrap.classList.remove("active");
  input.focus();
}

/* ===== THOUGHT BUBBLE ===== */

function showThoughtBubble(text) {
  if (!text || text.trim() === "") {
    hideThoughtBubble();
    return;
  }
  
  thoughtBubble.value = text;
  thoughtBubbleWrap.classList.add("active");
  
  // Auto-focus bubble
  setTimeout(() => thoughtBubble.focus(), 100);
}

function hideThoughtBubble() {
  thoughtBubbleWrap.classList.remove("active");
  thoughtBubble.value = "";
}

// Input: đồng bộ sang bubble nếu text > 30 ký tự
input.addEventListener("input", function() {
  const text = input.value;
  
  if (text.length > 30) {
    showThoughtBubble(text);
  } else {
    hideThoughtBubble();
  }
});

// Bubble: đồng bộ ngược về input
thoughtBubble.addEventListener("input", function() {
  const text = thoughtBubble.value;
  input.value = text;
  
  if (text.length <= 30) {
    hideThoughtBubble();
    input.focus();
  }
});

// Enter trong bubble = xuống dòng (mặc định, không làm gì thêm)

// Input mất focus
input.addEventListener("blur", function() {
  bubbleTimeout = setTimeout(() => {
    if (document.activeElement !== thoughtBubble) {
      hideThoughtBubble();
    }
  }, 200);
});

// Bubble mất focus
thoughtBubble.addEventListener("blur", function() {
  bubbleTimeout = setTimeout(() => {
    if (thoughtBubble.value.length <= 30) {
      hideThoughtBubble();
    }
  }, 200);
});

// Focus lại
input.addEventListener("focus", function() {
  if (bubbleTimeout) {
    clearTimeout(bubbleTimeout);
    bubbleTimeout = null;
  }
  if (input.value.length > 30) {
    showThoughtBubble(input.value);
  }
});

thoughtBubble.addEventListener("focus", function() {
  if (bubbleTimeout) {
    clearTimeout(bubbleTimeout);
    bubbleTimeout = null;
  }
});

/* ===== PLACE BUTTONS ===== */

placeBtn.addEventListener("click", () => {
  submitFragment(input.value);
});

placeBtnBubble.addEventListener("click", () => {
  submitFragment(thoughtBubble.value);
});

/* ===== CREATE NODE ===== */

function createNode(fragment) {
  const size = orbit.offsetWidth;
  const radius = size * 0.5;
  const center = size / 2;
  
  let angle = fragment.angle;
  if (angle === undefined) {
    angle = Math.random() * Math.PI * 2;
    fragment.angle = angle;
    save();
  }

  const x = center + radius * Math.cos(angle);
  const y = center + radius * Math.sin(angle);

  const node = document.createElement("div");
  node.className = "response";
  node.id = fragment.id;
  node.style.left = x + "px";
  node.style.top = y + "px";

  node.addEventListener("click", (e) => {
    e.stopPropagation();
    overlay.classList.add("is-open");
    display.innerText = fragment.text;
  });

  node.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    e.stopPropagation();
    activeContextFragment = fragment;
    
    const canModify = fragment.createdBy === userFingerprint || isAdmin;
    
    document.getElementById("ctxView").style.display = "block";
    document.getElementById("ctxEdit").style.display = canModify ? "block" : "none";
    document.getElementById("ctxDetach").style.display = canModify ? "block" : "none";
    
    contextMenu.style.display = "block";
    contextMenu.style.left = e.clientX + "px";
    contextMenu.style.top = e.clientY + "px";
  });

  orbit.appendChild(node);

  requestAnimationFrame(() => {
    node.classList.add("show");
  });
}

function removeNodeFromOrbit(id) {
  const node = document.getElementById(id);
  if (node) node.remove();
}

/* ===== INITIAL LOAD ===== */

fragments.forEach(fragment => {
  createNode(fragment);
});

/* ===== CLOSE RESPONSE OVERLAY ===== */

overlay.onclick = () => {
  overlay.classList.remove("is-open");
};

/* ===== CONTEXT MENU ACTIONS ===== */

document.getElementById("ctxView").addEventListener("click", () => {
  if (activeContextFragment) {
    overlay.classList.add("is-open");
    display.innerText = activeContextFragment.text;
  }
  contextMenu.style.display = "none";
});

document.getElementById("ctxEdit").addEventListener("click", () => {
  if (!activeContextFragment) return;
  
  const newText = prompt("Chỉnh sửa:", activeContextFragment.text);
  if (newText && newText.trim() !== "") {
    activeContextFragment.text = newText.trim();
    save();
  }
  contextMenu.style.display = "none";
});

document.getElementById("ctxDetach").addEventListener("click", () => {
  if (!activeContextFragment) return;
  
  if (confirm("Gỡ fragment này khỏi quỹ đạo? Hành động này không thể hoàn tác.")) {
    fragments = fragments.filter(f => f.id !== activeContextFragment.id);
    save();
    removeNodeFromOrbit(activeContextFragment.id);
  }
  contextMenu.style.display = "none";
});

document.addEventListener("click", () => {
  contextMenu.style.display = "none";
});

/* ===== TIMELINE MENU ===== */

const timelineToggle = document.getElementById('timelineToggle');
const timelineOverlay = document.getElementById('timelineOverlay');

timelineToggle.addEventListener('click', () => {
  timelineOverlay.classList.toggle('is-open');
});

timelineOverlay.addEventListener('click', (e) => {
  if (e.target === timelineOverlay) {
    timelineOverlay.classList.remove('is-open');
  }
});

</script>

</body>
</html>

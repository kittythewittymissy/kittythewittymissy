<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Biến dị trong vòng lặp</title>

<!-- Favicon -->
<link rel="icon" href="../../favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="../../favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../favicon/apple-touch-icon.png">
<link rel="manifest" href="favicon/site.webmanifest">

<!-- GLOBAL CSS -->
<link rel="stylesheet" href="../../style.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;600&family=Raleway+Dots&family=Codystar:wght@300;400;500&display=swap&subset=vietnamese" rel="stylesheet">

<style>

/* ===== STAGE ===== */

.stage {
  position: relative;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 0 1rem;
  box-sizing: border-box;
}

/* ===== OVAL TABLE ===== */
.oval-table {
  display: none;
}

/* ===== TITLE - Centered like htctt-uyen.tu ===== */

.work-title {
  position: relative;
  left: auto;
  top: auto;
  transform: none;
  width: 100%;
  text-align: center;
  z-index: 4;
  margin: 2rem 0 1rem 0;
}

.work-title h1 {
  font-family: 'Raleway', sans-serif;
  font-size: 2.8rem;
  letter-spacing: 0.16em;
  font-weight: 100;
  color: #222;
  text-shadow:
    0 0 1px var(--gold-core),
    0 0 2px var(--gold-core),
    0 0 4px var(--gold-core);
  opacity: 0;
  animation: neonSign-Gold 1.2s ease forwards;
  animation-delay: 0.3s;
  margin: 0;
  line-height: 1.2;
}

@keyframes neonSign-Gold {
  0%   { opacity:0; color:#222; text-shadow:none; }
  8%   { opacity:1; color:var(--gold-core); text-shadow:0 0 3px var(--gold-core); }
  16%  { opacity:0; color:#222; text-shadow:none; }
  25%  { opacity:1; color:var(--gold-core); text-shadow:0 0 6px var(--gold-core),0 0 10px rgba(255,214,98,0.7); }
  50%  { opacity:1; color:#fff; text-shadow:0 0 10px #fff,0 0 18px var(--gold-core); }
  66%  { opacity:1; color:var(--gold-core); text-shadow:0 0 6px var(--gold-core),0 0 12px rgba(255,214,98,0.8); }
  83%  { opacity:0.6; color:#222; text-shadow:none; }
  92%  { opacity:1; color:var(--gold-core); text-shadow:0 0 4px var(--gold-core),0 0 12px rgba(255,214,98,0.7); }
  100% { opacity:1; color:var(--gold-core); text-shadow:0 0 2px var(--gold-core),0 0 6px var(--gold-core),0 0 12px rgba(255,214,98,0.8),0 0 16px rgba(255,214,98,0.6); }
}

/* ===== TOPIC ===== */

.paragraph {
  position: relative;
  left: auto;
  top: auto;
  transform: none;
  max-width: 520px;
  text-align: center;
  font-size: 1.1rem;
  opacity: 0;
  animation: bodyFade 1.2s ease forwards;
  animation-delay: 0.6s;
  z-index: 3;
  margin: 1rem auto;
}

.center-bold {
  display: block;
  margin-top: 0.5rem;
  font-weight: 600;
  font-size: 1.2rem;
  letter-spacing: 0.05em;
  text-shadow: var(--glow-white);
  opacity: 0;
  animation: bodyFade 1s ease forwards;
  animation-delay: 1.8s;
}

/* ===== ORBIT - Perfect Circle ===== */

.orbit-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 2rem 0;
}

.orbit {
  position: relative;
  width: min(440px, 85vw);
  height: min(440px, 85vw);
  z-index: 2;
  animation: orbit 90s linear infinite;
  border-radius: 50%;
  flex-shrink: 0;
}

.orbit::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px dashed rgba(255,255,255,0.36);
  box-shadow:
    0 0 10px rgba(255,255,255,0.20),
    0 0 20px rgba(255,255,255,0.11),
    0 0 40px rgba(255,255,255,0.045);
}

@keyframes orbit { 
  from { transform: rotate(0deg); } 
  to { transform: rotate(360deg); } 
}

/* ===== RESPONSE NODES ===== */

.response {
  position: absolute;
  z-index: 4;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--gold-core);
  box-shadow:
    0 0 6px var(--gold-core),
    0 0 16px var(--gold-core),
    0 0 36px var(--gold-bloom);
  opacity: 0;
  transform: translate(-50%, -50%);
  transition:
    opacity 0.4s ease,
    transform 0.4s ease;
  cursor: pointer;
  animation: nodePulse 2s infinite alternate;
}

@keyframes nodePulse {
  0% { box-shadow: 0 0 6px var(--gold-core), 0 0 16px var(--gold-core); }
  100% { box-shadow: 0 0 10px var(--gold-core), 0 0 24px var(--gold-core), 0 0 40px var(--gold-bloom); }
}

.response.show {
  opacity: 1;
  transform: translate(-50%, -50%);
}

/* ===== INPUT BOX - Under circle ===== */

.input-wrap {
  position: relative;
  bottom: auto;
  left: auto;
  transform: none;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  opacity: 0;
  animation: bodyFade 1s ease forwards;
  animation-delay: 2.4s;
  z-index: 6;
  margin: 2rem auto;
  justify-content: center;
  width: 100%;
  max-width: 400px;
}

.input {
  width: 280px;
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(255,214,98,0.4);
  color: var(--white-accent);
  font-family: 'Raleway', sans-serif;
  font-weight: 100;
  font-size: 1rem;
  text-align: center;
  padding: 6px;
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
}

.input::placeholder {
  color: rgba(255,255,255,0.35);
}

.input:focus {
  border-bottom: 1px solid var(--gold-core);
  box-shadow: 0 0 8px var(--gold-bloom);
}

/* ===== PLACE BUTTON ===== */

.place-btn {
  font-family: 'Raleway', sans-serif;
  font-size: 1.1rem;
  font-weight: normal;
  color: var(--white-accent);
  background: transparent;
  border: 1px solid rgba(255,214,98,0.35);
  border-radius: 50%;
  width: 42px;
  height: 42px;
  cursor: pointer;
  text-shadow:
    0 0 3px #fff,
    0 0 8px rgba(255,255,255,0.6),
    0 0 16px rgba(255,255,255,0.4);
  box-shadow:
    0 0 6px rgba(255,214,98,0.2),
    0 0 14px rgba(255,214,98,0.1);
  transition:
    text-shadow 0.3s,
    box-shadow 0.3s,
    border-color 0.3s,
    transform 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.place-btn:hover {
  color: var(--gold-core);
  text-shadow:
    0 0 4px var(--gold-core),
    0 0 10px var(--gold-bloom),
    0 0 20px rgba(255,214,98,0.5);
  border-color: var(--gold-core);
  box-shadow:
    0 0 10px var(--gold-core),
    0 0 22px var(--gold-bloom);
  transform: scale(1.05);
}

/* ===== THOUGHT BUBBLE ===== */

.thought-bubble-wrap {
  position: fixed;
  left: auto;
  right: 2rem;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.8rem;
  z-index: 5;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
  max-width: 380px;
}

.thought-bubble-wrap.active {
  opacity: 1;
  pointer-events: auto;
}

.thought-bubble {
  min-width: 280px;
  max-width: 100%;
  min-height: 100px;
  max-height: 65vh;
  padding: 2rem 2.2rem;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,214,98,0.25);
  border-radius: 24px;
  color: var(--white-accent);
  font-family: 'Raleway', sans-serif;
  font-weight: 100;
  font-size: 1.1rem;
  line-height: 1.9;
  text-align: left;
  resize: none;
  outline: none;
  word-wrap: break-word;
  overflow-wrap: break-word;
  white-space: pre-wrap;
  overflow-y: auto;
  box-shadow:
    0 0 12px rgba(255,214,98,0.12),
    0 0 28px rgba(0,0,0,0.5);
}

.thought-bubble::placeholder {
  color: rgba(255,255,255,0.3);
}

/* Thought bubble tail */
.thought-bubble-wrap::before {
  content: "";
  position: absolute;
  top: 50%;
  right: -18px;
  transform: translateY(-50%);
  width: 0;
  height: 0;
  border-top: 10px solid transparent;
  border-bottom: 10px solid transparent;
  border-left: 18px solid rgba(255,214,98,0.25);
  pointer-events: none;
}

/* ===== CENTERED OVERLAY TEXT ===== */

#singleResponse {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  max-width: 540px;
  width: auto;
  text-align: center;
  font-size: 1.8rem;
  font-weight: 200;
  line-height: 1.8;
  word-break: break-word;
  overflow-wrap: break-word;
  white-space: normal;
  overflow-y: auto;
  max-height: 70vh;
  padding: 1.5rem;
}

/* ===== FADE ===== */

@keyframes bodyFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ===== CONTEXT MENU ===== */

.context-menu {
  position: fixed;
  z-index: 3000;
  background: rgba(0,0,0,0.95);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,214,98,0.3);
  border-radius: 12px;
  padding: 0.5rem 0;
  min-width: 200px;
  box-shadow:
    0 0 12px rgba(255,214,98,0.15),
    0 0 24px rgba(0,0,0,0.8);
  display: none;
}

.context-menu button {
  display: block;
  width: 100%;
  background: none;
  border: none;
  color: #fff;
  font-family: 'Raleway', sans-serif;
  font-weight: 100;
  font-size: 1rem;
  padding: 0.75rem 1.5rem;
  text-align: left;
  cursor: pointer;
  transition: background 0.2s, text-shadow 0.2s;
}

.context-menu button:hover {
  background: rgba(255,214,98,0.15);
  text-shadow:
    0 0 8px #fff,
    0 0 16px rgba(255,255,255,0.7);
}

.context-menu .divider {
  border-top: 1px solid rgba(255,214,98,0.2);
  margin: 0.3rem 0;
}

/* ===== TIMELINE TOGGLE ===== */

.timeline-toggle {
  z-index: 2000;
  position: fixed;
  bottom: 5rem;
  right: 1rem;
  width: 56px;
  height: 56px;
}

.back-button {
  top: 1rem;
  right: 1rem;
}

/* ===== MOBILE OVERRIDES ===== */
@media(max-width:768px) {

  .stage {
    padding: 0 1rem;
    min-height: auto;
  }

  .work-title {
    margin: 1rem 0 0.5rem 0;
  }

  .work-title h1 {
    font-size: 2.2rem;
    line-height: 1.2;
  }

  .paragraph {
    font-size: 0.95rem;
    max-width: 90%;
    margin: 0.5rem auto;
  }

  .center-bold {
    font-size: 1rem;
  }

  .orbit {
    width: min(360px, 80vw);
    height: min(360px, 80vw);
    margin: 0.5rem auto;
  }

  .response {
    width: 14px;
    height: 14px;
  }

  .input-wrap {
    margin: 1rem auto 2rem auto;
    width: 90%;
    max-width: 320px;
  }

  .input {
    width: 100%;
    font-size: 0.9rem;
  }

  /* Thought bubble - full width on mobile */
  .thought-bubble-wrap {
    position: fixed;
    left: 50%;
    right: auto;
    top: auto;
    bottom: 20%;
    transform: translateX(-50%);
    width: 90%;
    max-width: none;
    align-items: center;
    z-index: 20;
  }

  .thought-bubble {
    width: 100%;
    min-width: auto;
    max-width: 100%;
    font-size: 0.9rem;
    padding: 1rem 1.2rem;
    min-height: auto;
  }

  .thought-bubble-wrap .place-btn {
    position: relative;
    z-index: 21;
    margin: 0 auto;
  }

  .thought-bubble-wrap::before {
    top: auto;
    bottom: -16px;
    left: 50%;
    right: auto;
    transform: translateX(-50%);
    border-right: 10px solid transparent;
    border-left: 10px solid transparent;
    border-top: 16px solid rgba(255,214,98,0.25);
    border-bottom: none;
  }

   /* Main input wrap button also higher */
  .input-wrap .place-btn {
    z-index: 10;
  }

  #singleResponse {
    width: 85%;
    font-size: 1.1rem;
    line-height: 1.6;
    padding: 1rem;
  }

  .context-menu {
    min-width: 180px;
  }

  .context-menu button {
    font-size: 0.9rem;
    padding: 0.6rem 1.2rem;
  }
}

</style>
</head>

<body>

<!-- BACK BUTTON -->

<a href="ban.html" class="back-button">
  <span class="back-text">Back to</span>
  <span class="kitty-text">Bàn</span>
</a>

<!-- MAIN STAGE -->

<div class="stage">

  <div class="work-title">
    <h1>Biến dị
      <br>trong<br>
      vòng lặp</h1>
  </div>

  <div class="paragraph body-text">
    Trong mỗi vòng lặp,

    <span class="center-bold">
      một sai lệch nhỏ xảy ra.
    </span>

  <div class="orbit-wrapper">
    <div class="orbit" id="orbit"></div>
  </div>

  <!-- INPUT + PLACE BUTTON -->
  <div class="input-wrap">

  </div>

<div class="thought-bubble-wrap" id="thoughtBubbleWrap">
  <textarea class="thought-bubble" id="thoughtBubble" placeholder="Tiếp tục gõ..."></textarea>

<div class="context-menu" id="contextMenu">
  <button id="ctxView">📖 Xem</button>
  <div class="divider"></div>
  <button id="ctxEdit">✏️ Chỉnh sửa</button>
  <button id="ctxDetach">🗑️ Gỡ khỏi quỹ đạo</button>
</div>

<div class="timeline-overlay" id="timelineOverlay">
  <div class="timeline-wrap">

        <div class="timeline-dot"></div>

          <div class="timeline-title">Biến dị<br>trong<br>vòng lặp</div>
        </div>
      </a>
    </div>
  </div>
</div>

<script>

/* ===== SESSION FINGERPRINT ===== */

const FINGERPRINT_KEY = 'tdrb_user_fp';
let userFingerprint = sessionStorage.getItem(FINGERPRINT_KEY);
if (!userFingerprint) {
  userFingerprint = crypto.randomUUID();
  sessionStorage.setItem(FINGERPRINT_KEY, userFingerprint);
}

const ADMIN_TOKEN = 'tdrb_admin_2026';
let isAdmin = sessionStorage.getItem('tdrb_admin') === ADMIN_TOKEN;

/* ===== DOM REFERENCES ===== */

const input = document.getElementById("input");
const orbit = document.getElementById("orbit");
const overlay = document.getElementById("overlay");
const display = document.getElementById("singleResponse");
const contextMenu = document.getElementById("contextMenu");
const thoughtBubble = document.getElementById("thoughtBubble");
const thoughtBubbleWrap = document.getElementById("thoughtBubbleWrap");
const placeBtn = document.getElementById("placeBtn");
const placeBtnBubble = document.getElementById("placeBtnBubble");

/* ===== STATE ===== */

const STORAGE_KEY = "tdrb_fragments";
let fragments = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
let activeContextFragment = null;
let bubbleTimeout = null;
let longPressTimer = null;

/* ===== HELPERS ===== */

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(fragments));
}

function submitFragment(text) {
  const trimmed = text.trim();
  if (trimmed === "") return;

  const fragment = {
    id: crypto.randomUUID(),
    text: trimmed,
    createdBy: userFingerprint,
    createdAt: Date.now()
  };

  fragments.push(fragment);
  save();
  createNode(fragment);

  // Reset
  input.value = "";
  thoughtBubble.value = "";
  thoughtBubbleWrap.classList.remove("active");
  input.focus();
}

/* ===== THOUGHT BUBBLE ===== */

function showThoughtBubble(text) {
  if (!text || text.trim() === "") {
    hideThoughtBubble();
    return;
  }
  
  thoughtBubble.value = text;
  thoughtBubbleWrap.classList.add("active");
  
  // Auto-focus bubble on mobile after short delay
  setTimeout(() => {
    if (window.innerWidth <= 768) {
      thoughtBubble.focus();
    }
  }, 100);
}

function hideThoughtBubble() {
  thoughtBubbleWrap.classList.remove("active");
  thoughtBubble.value = "";
}

// Check if text needs bubble (more than 1 line worth of characters - approx 30 chars)
function needsBubble(text) {
  // On mobile, bubble appears for any text > 1 line
  // Rough estimate: ~30 chars per line
  return text.length > 30;
}

// Input: đồng bộ sang bubble if needed
input.addEventListener("input", function() {
  const text = input.value;
  
  if (needsBubble(text)) {
    showThoughtBubble(text);
  } else {
    hideThoughtBubble();
  }
});

// Bubble: đồng bộ ngược về input
thoughtBubble.addEventListener("input", function() {
  const text = thoughtBubble.value;
  input.value = text;
  
  if (!needsBubble(text)) {
    hideThoughtBubble();
    if (window.innerWidth <= 768) {
      input.focus();
    }
  }
});

// Input mất focus
input.addEventListener("blur", function() {
  bubbleTimeout = setTimeout(() => {
    if (document.activeElement !== thoughtBubble && !needsBubble(input.value)) {
      hideThoughtBubble();
    }
  }, 200);
});

// Bubble mất focus
thoughtBubble.addEventListener("blur", function() {
  bubbleTimeout = setTimeout(() => {
    if (!needsBubble(thoughtBubble.value)) {
      hideThoughtBubble();
    }
  }, 200);
});

// Focus lại
input.addEventListener("focus", function() {
  if (bubbleTimeout) {
    clearTimeout(bubbleTimeout);
    bubbleTimeout = null;
  }
  if (needsBubble(input.value)) {
    showThoughtBubble(input.value);
  }
});

thoughtBubble.addEventListener("focus", function() {
  if (bubbleTimeout) {
    clearTimeout(bubbleTimeout);
    bubbleTimeout = null;
  }
});

/* ===== PLACE BUTTONS ===== */

placeBtn.addEventListener("click", () => {
  submitFragment(input.value);
});

placeBtnBubble.addEventListener("click", () => {
  submitFragment(thoughtBubble.value);
});

/* ===== CREATE NODE ===== */

function createNode(fragment) {
  const size = orbit.offsetWidth;
  const radius = size * 0.5;
  const center = size / 2;
  
  let angle = fragment.angle;
  if (angle === undefined) {
    angle = Math.random() * Math.PI * 2;
    fragment.angle = angle;
    save();
  }

  const x = center + radius * Math.cos(angle);
  const y = center + radius * Math.sin(angle);

  const node = document.createElement("div");
  node.className = "response";
  node.id = fragment.id;
  node.style.left = x + "px";
  node.style.top = y + "px";

  // Single tap or click - show content
  node.addEventListener("click", (e) => {
    e.stopPropagation();
    overlay.classList.add("is-open");
    display.innerText = fragment.text;
  });

  // Double tap/click - open edit menu
  node.addEventListener("dblclick", (e) => {
    e.stopPropagation();
    openContextMenuForNode(e, fragment);
  });

  // Long press for mobile
  node.addEventListener("touchstart", (e) => {
    longPressTimer = setTimeout(() => {
      openContextMenuForNode(e, fragment);
    }, 500);
  });

  node.addEventListener("touchend", (e) => {
    if (longPressTimer) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
    }
  });

  node.addEventListener("touchmove", (e) => {
    if (longPressTimer) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
    }
  });

  orbit.appendChild(node);

  requestAnimationFrame(() => {
    node.classList.add("show");
  });
}

function openContextMenuForNode(event, fragment) {
  event.preventDefault();
  event.stopPropagation();
  
  activeContextFragment = fragment;
  
  const canModify = fragment.createdBy === userFingerprint || isAdmin;
  
  document.getElementById("ctxView").style.display = "block";
  document.getElementById("ctxEdit").style.display = canModify ? "block" : "none";
  document.getElementById("ctxDetach").style.display = canModify ? "block" : "none";
  
  let clientX, clientY;
  if (event.touches) {
    clientX = event.touches[0].clientX;
    clientY = event.touches[0].clientY;
  } else {
    clientX = event.clientX;
    clientY = event.clientY;
  }
  
  contextMenu.style.display = "block";
  contextMenu.style.left = clientX + "px";
  contextMenu.style.top = clientY + "px";
}

function removeNodeFromOrbit(id) {
  const node = document.getElementById(id);
  if (node) node.remove();
}

/* ===== INITIAL LOAD ===== */

fragments.forEach(fragment => {
  createNode(fragment);
});

/* ===== CLOSE RESPONSE OVERLAY ===== */

overlay.onclick = () => {
  overlay.classList.remove("is-open");
};

/* ===== CONTEXT MENU ACTIONS ===== */

document.getElementById("ctxView").addEventListener("click", () => {
  if (activeContextFragment) {
    overlay.classList.add("is-open");
    display.innerText = activeContextFragment.text;
  }
  contextMenu.style.display = "none";
});

document.getElementById("ctxEdit").addEventListener("click", () => {
  if (!activeContextFragment) return;
  
  const newText = prompt("Chỉnh sửa:", activeContextFragment.text);
  if (newText && newText.trim() !== "") {
    activeContextFragment.text = newText.trim();
    save();
  }
  contextMenu.style.display = "none";
});

document.getElementById("ctxDetach").addEventListener("click", () => {
  if (!activeContextFragment) return;
  
  if (confirm("Gỡ suy nghĩ này khỏi quỹ đạo? Hành động này không thể hoàn tác.")) {
    fragments = fragments.filter(f => f.id !== activeContextFragment.id);
    save();
    removeNodeFromOrbit(activeContextFragment.id);
  }
  contextMenu.style.display = "none";
});

document.addEventListener("click", () => {
  contextMenu.style.display = "none";
});

/* ===== TIMELINE MENU ===== */

const timelineToggle = document.getElementById('timelineToggle');
const timelineOverlay = document.getElementById('timelineOverlay');

timelineToggle.addEventListener('click', () => {
  timelineOverlay.classList.toggle('is-open');
});

timelineOverlay.addEventListener('click', (e) => {
  if (e.target === timelineOverlay) {
    timelineOverlay.classList.remove('is-open');
  }
});

/* ===== RESIZE HANDLER to maintain node positions ===== */
let resizeTimeout;
window.addEventListener('resize', () => {
  if (resizeTimeout) clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(() => {
    // Reposition all nodes on resize
    fragments.forEach(fragment => {
      const node = document.getElementById(fragment.id);
      if (node) {
        const size = orbit.offsetWidth;
        const radius = size * 0.5;
        const center = size / 2;
        const angle = fragment.angle;
        const x = center + radius * Math.cos(angle);
        const y = center + radius * Math.sin(angle);
        node.style.left = x + "px";
        node.style.top = y + "px";
      }
    });
  }, 250);
});

</script>

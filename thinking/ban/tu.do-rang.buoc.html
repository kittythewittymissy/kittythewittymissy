<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tự do - Ràng buộc</title>

<!-- Favicon -->
<link rel="icon" href="../../favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="../../favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../favicon/apple-touch-icon.png">
<link rel="manifest" href="favicon/site.webmanifest">

<!-- GLOBAL CSS -->
<link rel="stylesheet" href="../../style.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;600&family=Raleway+Dots&family=Codystar:wght@300;400;500&display=swap&subset=vietnamese" rel="stylesheet">

<style>

/* ===== PAGE-SPECIFIC ONLY ===== */

.stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== TITLE ===== */

.work-title {
  position: absolute;
  left: 2rem;
  top: 50%;
  transform: translateY(-50%);
  width: auto;
  text-align: left;
  z-index: 4;
}

.work-title h1 {
  font-family: 'Raleway Dots', sans-serif;
  font-size: 4rem;
  letter-spacing: 0.16em;
  font-weight: 100;

  color: #222;

  text-shadow:
    0 0 1px var(--gold-core),
    0 0 2px var(--gold-core),
    0 0 4px var(--gold-core);

  opacity: 0;

  animation: neonSign-Gold 1.2s ease forwards;
  animation-delay: 0.3s;
}

/* ===== TOPIC ===== */

.paragraph {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  max-width: 520px;
  text-align: center;
  font-size: 1.25rem;
  opacity: 0;
  animation: bodyFade 1.2s ease forwards;
  animation-delay: 0.6s;
  z-index: 3;
}

.center-bold {
  display: block;
  margin-top: 1rem;
  font-weight: 600;
  font-size: 1.4rem;
  letter-spacing: 0.05em;
  text-shadow: var(--glow-white);
  opacity: 0;
  animation: bodyFade 1s ease forwards;
  animation-delay: 1.8s;
}

/* ===== INPUT BOX ===== */

.input {
  position: fixed;
  bottom: 12%;
  left: 50%;
  transform: translateX(-50%);

  width: 280px;

  background: transparent;

  border: none;
  border-bottom: 1px solid rgba(255,214,98,0.4);

  color: var(--white-accent);

  font-family: 'Raleway', sans-serif;
  font-weight: 100;
  font-size: 1rem;

  text-align: center;

  padding: 6px;

  outline: none;

  opacity: 0;

  animation: bodyFade 1s ease forwards;
  animation-delay: 2.4s;
}

.input::placeholder {
  color: rgba(255,255,255,0.35);
}

.input:focus {
  border-bottom: 1px solid var(--gold-core);

  box-shadow: 0 0 8px var(--gold-bloom);
}

/* ===== ORBIT ===== */

.orbit {
  position: relative;
  width: 440px;
  height: 440px;
  z-index: 2;
  animation: orbit 90s linear infinite;
}

.orbit::before {
  content: "";

  position: absolute;
  inset: 0;

  border-radius: 50%;

  border: 1px dashed rgba(255,255,255,0.22);

  box-shadow:
    0 0 6px rgba(255,255,255,0.18),
    0 0 12px rgba(255,255,255,0.10),
    0 0 24px rgba(255,255,255,0.04);
}

/* ===== RESPONSE ===== */

.response {
  position: absolute;
  z-index: 4;

  width: 18px;
  height: 18px;

  border-radius: 50%;

  background: var(--gold-core);

  box-shadow:
    0 0 6px var(--gold-core),
    0 0 16px var(--gold-core),
    0 0 36px var(--gold-bloom);

  opacity: 0;

  transform: translate(-50%, -50%) scale(0.5);

  transition:
    opacity 0.4s ease,
    transform 0.4s ease;

  cursor: pointer;
}

.response.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

/* ===== CENTERED OVERLAY TEXT ===== */

#singleResponse {
  position: absolute;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  max-width: 700px;

  text-align: center;

  font-size: 1.8rem;
  font-weight: 200;
  line-height: 1.8;
}

/* ===== FADE ===== */

@keyframes bodyFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* TIMELINE TOGGLE */

.timeline-toggle {
  z-index: 2000;
  position: fixed;
}

/* ===== MOBILE ===== */

@media(max-width:768px) {

  .stage {
    padding: 2rem;
  }

  .orbit {
    width: 360px;
    height: 360px;
  }

  .work-title {
    left: 50%;
    top: 25%;
    transform: translate(-50%, -50%);
    width: 90%;
    text-align: center;
  }

  .work-title h1 {
    font-size: 2.6rem;
    line-height: 1.2;
  }

  .paragraph {
    max-width: 88%;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    font-size: 1.05rem;
    line-height: 1.8;
  }

  .center-bold {
    font-size: 1.15rem;
  }

  .input {
    width: 72%;

    bottom: 10%;

    font-size: 0.95rem;
  }

  .response {
    width: 16px;
    height: 16px;
  }

  #singleResponse {
    width: 82%;
    font-size: 1.2rem;
    line-height: 1.8;
  }


  .timeline-toggle {
    width: 56px;
    height: 56px;

    right: 1rem;
    bottom: 5rem;
  }

  .back-button {
    top: 1rem;
    right: 1rem;
  }

  .back-button .kitty-text {
    font-size: 2rem;
  }

  .back-button .back-text {
    font-size: 1rem;
  }
}

</style>
</head>

<body>

<!-- BACK BUTTON -->

<a href="ban.html" class="back-button">
  <span class="back-text">Back to</span>
  <span class="kitty-text">Bàn</span>
</a>

<!-- MAIN STAGE -->

<div class="stage">

  <div class="work-title">
    <h1>Tự do<br>-<br>Ràng buộc</h1>
  </div>

  <div class="paragraph body-text">
    Mọi thứ càng ngày càng tệ?

    <span class="center-bold">
      Chúng ta có tự do không?
    </span>
  </div>

  <div class="orbit" id="orbit"></div>

</div>

<!-- TIMELINE TOGGLE -->

<div class="timeline-toggle" id="timelineToggle"></div>

<!-- INPUT -->

<input id="input" class="input" placeholder="Bạn nghĩ sao?" />

<!-- RESPONSE OVERLAY -->

<div class="timeline-overlay" id="overlay">
  <div id="singleResponse" class="body-text"></div>
</div>

<!-- MENU OVERLAY -->

<div class="timeline-overlay" id="timelineOverlay">

  <div class="timeline-wrap">

    <div class="timeline-list">

      <a href="topic-1.html" class="timeline-item">

        <div class="timeline-dot"></div>

        <div class="timeline-content">
          <div class="timeline-title">Ý thức</div>
        </div>

      </a>

      <a href="topic-2.html" class="timeline-item">

        <div class="timeline-dot"></div>

        <div class="timeline-content">
          <div class="timeline-title">Tự do</div>
        </div>

      </a>

      <a href="topic-3.html" class="timeline-item">

        <div class="timeline-dot"></div>

        <div class="timeline-content">
          <div class="timeline-title">Cái đẹp</div>
        </div>

      </a>

    </div>

  </div>

</div>

<script>

const input = document.getElementById("input");
const orbit = document.getElementById("orbit");

const overlay = document.getElementById("overlay");
const display = document.getElementById("singleResponse");

const STORAGE_KEY = "ban_topic_placeholder";

/* ===== LOAD ===== */

let responses = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

/* ===== CREATE NODE ===== */

function createNode(text) {

  const rect = orbit.getBoundingClientRect();
  const size = rect.width;
  const radius = size * 0.43;
  const center = size / 2;
  const angle = Math.random() * Math.PI * 2;

  const x = center + radius * Math.cos(angle);
  const y = center + radius * Math.sin(angle);

  const node = document.createElement("div");

  node.className = "response";

  node.style.left = x + "px";
  node.style.top = y + "px";

  node.addEventListener("click", (e) => {

  if (e.shiftKey) {

    const index = responses.indexOf(text);

    if (index > -1) {

      responses.splice(index, 1);

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(responses)
      );

      node.remove();
    }

    return;
  }

  overlay.classList.add("is-open");
  display.innerText = text;

});

  orbit.appendChild(node);

  requestAnimationFrame(() => {
    node.classList.add("show");
  });
}

/* ===== INITIAL LOAD ===== */

responses.forEach(createNode);

/* ===== INPUT ===== */

input.addEventListener("keydown", function(e) {

  if (e.key === "Enter" && input.value.trim() !== "") {

    const text = input.value.trim();

    responses.push(text);

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(responses)
    );

    createNode(text);

    input.value = "";

  }

});

/* ===== CLOSE RESPONSE OVERLAY ===== */

overlay.onclick = () => {
  overlay.classList.remove("is-open");
};

/* ===== TIMELINE MENU ===== */

const timelineToggle = document.getElementById('timelineToggle');

const timelineOverlay = document.getElementById('timelineOverlay');

timelineToggle.addEventListener('click', () => {
  timelineOverlay.classList.toggle('is-open');
});

timelineOverlay.addEventListener('click', (e) => {

  if (e.target === timelineOverlay) {
    timelineOverlay.classList.remove('is-open');
  }

});

</script>

</body>
</html>

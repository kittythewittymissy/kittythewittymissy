<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tự do - Ràng buộc</title>

<!-- Favicon -->
<link rel="icon" href="../../favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="../../favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../favicon/apple-touch-icon.png">
<link rel="manifest" href="favicon/site.webmanifest">

<!-- GLOBAL CSS -->
<link rel="stylesheet" href="../../style.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;600&family=Raleway+Dots&family=Codystar:wght@300;400;500&display=swap&subset=vietnamese" rel="stylesheet">

<style>

/* ===== PAGE-SPECIFIC ONLY ===== */

.stage {
  position: fixed;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;
}

.circle {
  position: absolute;

  width: 440px;
  height: 440px;

  border-radius: 50%;

  border: 1px dashed rgba(255,255,255,0.25);

  box-shadow:
    0 0 12px rgba(255,255,255,0.08),
    0 0 24px rgba(255,255,255,0.04);

  animation: orbit 90s linear infinite;
}

.work-title { 
  position: relative;
  top: auto;
  left: auto;

  padding: 2rem 5rem;
}

.paragraph {
  max-width: 520px;

  margin: 0 auto;

  text-align: center;

  font-size: 1.25rem;

  opacity: 0;

  animation: bodyFade 1.2s ease forwards;
  animation-delay: 0.6s;
}

.center-bold {
  display: block;

  margin-top: 1rem;

  font-weight: 600;
  font-size: 1.4rem;

  letter-spacing: 0.05em;

  text-shadow: var(--glow-white);

  opacity: 0;

  animation: bodyFade 1s ease forwards;
  animation-delay: 1.8s;
}

/* ===== INPUT ===== */

.input {
  position: fixed;

  bottom: 12%;
  left: 50%;

  transform: translateX(-50%);

  width: 280px;

  background: transparent;

  border: none;
  border-bottom: 1px solid rgba(255,214,98,0.4);

  color: var(--white-accent);

  font-family: 'Raleway', sans-serif;
  font-weight: 100;
  font-size: 1rem;

  text-align: center;

  padding: 6px;

  outline: none;

  opacity: 0;

  animation: bodyFade 1s ease forwards;
  animation-delay: 2.4s;
}

.input::placeholder {
  color: rgba(255,255,255,0.35);
}

.input:focus {
  border-bottom: 1px solid var(--gold-core);

  box-shadow: 0 0 8px var(--gold-bloom);
}

/* ===== ORBIT ===== */

.orbit {
  width: 440px;
  height: 440px;

  animation: orbitRotate 90s linear infinite;
}

.orbit::before {
  content: "";

  position: absolute;
  inset: 0;

  border-radius: 50%;

  border: 1px dashed rgba(255,255,255,0.22);

  box-shadow:
    0 0 6px rgba(255,255,255,0.18),
    0 0 12px rgba(255,255,255,0.10),
    0 0 24px rgba(255,255,255,0.04);
}

/* ===== CENTERED OVERLAY TEXT ===== */

#singleResponse {
  position: absolute;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  max-width: 700px;

  text-align: center;

  font-size: 1.8rem;
  font-weight: 200;
  line-height: 1.8;
}

/* ===== FADE ===== */

@keyframes bodyFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* =========================
   TIMELINE OVERLAY MENU
========================= */

.vertical-menu {
  justify-content: center;
  padding: 0;
}

.vertical-menu .timeline-list {
  flex-direction: column;
  gap: 2.8rem;
}

.vertical-menu .timeline-item {
  min-width: auto;
  padding: 0;

  display: flex;
  align-items: center;
  justify-content: flex-start;

  text-decoration: none;

  transition:
    transform 0.25s ease,
    opacity 0.25s ease;
}

.vertical-menu .timeline-item:hover {
  transform: translateX(-6px);
}

.vertical-menu .timeline-dot {
  position: relative;

  left: auto;
  top: auto;

  transform: none;

  margin-right: 1.2rem;

  width: 14px;
  height: 14px;
}

.vertical-menu .timeline-content {
  position: relative;

  left: auto;
  top: auto;
  bottom: auto;

  transform: none;

  width: auto;

  text-align: left;
}

.vertical-menu .timeline-title {
  font-size: 2rem;
  letter-spacing: 0.12em;
}

.vertical-menu .timeline-item:hover .timeline-title {
  color: var(--gold-core);

  text-shadow:
    0 0 6px var(--gold-core),
    0 0 16px var(--gold-bloom);
}

/* ===== MOBILE ===== */

@media(max-width:768px) {

  .stage {
    padding: 2rem;
  }

  .circle {
    width: 300px;
    height: 300px;
  }

  .orbit {
    width: 360px;
    height: 360px;
  }

  .work-title {
    padding:
      4rem
      1.5rem
      2rem
      1.5rem;
  }

  .work-title h1 {
    font-size: 2.8rem;

    line-height: 1.2;

    -webkit-text-stroke: 0;
  }

  .paragraph {
    max-width: 88%;

    font-size: 1.05rem;
    line-height: 1.8;
  }

  .center-bold {
    font-size: 1.15rem;
  }

  .input {
    width: 72%;

    bottom: 10%;

    font-size: 0.95rem;
  }

  .response {
    width: 18px;
    height: 18px;
  }

  #singleResponse {
    width: 82%;

    font-size: 1.2rem;
    line-height: 1.8;
  }

  .vertical-menu .timeline-title {
    font-size: 1.5rem;
  }

  .vertical-menu .timeline-list {
    gap: 2rem;
  }

  .vertical-menu .timeline-dot {
    width: 12px;
    height: 12px;
  }

  .timeline-toggle {
    width: 56px;
    height: 56px;

    right: 1rem;
    bottom: 5rem;
  }

  .back-button {
    top: 1rem;
    right: 1rem;
  }

  .back-button .kitty-text {
    font-size: 2rem;
  }

  .back-button .back-text {
    font-size: 1rem;
  }
}

</style>
</head>

<body>

<!-- BACK BUTTON -->

<a href="ban.html" class="back-button">
  <span class="back-text">Back to</span>
  <span class="kitty-text">Bàn</span>
</a>

<!-- MAIN STAGE -->

<div class="stage">

  <div class="circle"></div>

  <div class="work-title">
    <h1>Bàn</h1>
  </div>

  <div class="paragraph body-text">
    Ta vào bàn, để bàn.

    <span class="center-bold">
      Hãy lên tiếng.
    </span>
  </div>

  <div class="orbit" id="orbit"></div>

  <!-- TIMELINE TOGGLE -->

  <div class="timeline-toggle" id="timelineToggle"></div>

</div>

<!-- INPUT -->

<input id="input" class="input" placeholder="Bạn nghĩ sao?" />

<!-- RESPONSE OVERLAY -->

<div class="timeline-overlay" id="overlay">
  <div id="singleResponse" class="body-text"></div>
</div>

<!-- MENU OVERLAY -->

<div class="timeline-overlay" id="timelineOverlay">

  <div class="timeline-wrap vertical-menu">

    <div class="timeline-list">

      <a href="topic-1.html" class="timeline-item">

        <div class="timeline-dot"></div>

        <div class="timeline-content">
          <div class="timeline-title">Ý thức</div>
        </div>

      </a>

      <a href="topic-2.html" class="timeline-item">

        <div class="timeline-dot"></div>

        <div class="timeline-content">
          <div class="timeline-title">Tự do</div>
        </div>

      </a>

      <a href="topic-3.html" class="timeline-item">

        <div class="timeline-dot"></div>

        <div class="timeline-content">
          <div class="timeline-title">Cái đẹp</div>
        </div>

      </a>

    </div>

  </div>

</div>

<script>

const input = document.getElementById("input");
const orbit = document.getElementById("orbit");

const overlay = document.getElementById("overlay");
const display = document.getElementById("singleResponse");

/* ===== LOAD ===== */

let responses = JSON.parse(localStorage.getItem("ban_responses")) || [];

/* ===== CREATE NODE ===== */

function createNode(text) {

  const angle = Math.random() * Math.PI * 2;
  const radius = 220;

  const orbitSize = 520;
  const center = orbitSize / 2;

  const x = center + radius * Math.cos(angle);
  const y = center + radius * Math.sin(angle);

  const node = document.createElement("div");

  node.className = "response";

  node.style.left = x + "px";
  node.style.top = y + "px";

  let clickTimer = null;

  node.addEventListener("click", (e) => {

    if (e.shiftKey) {

      if (clickTimer) {

        clearTimeout(clickTimer);

        clickTimer = null;

        const index = responses.indexOf(text);

        if (index > -1) {

          responses.splice(index, 1);

          localStorage.setItem(
            "ban_responses",
            JSON.stringify(responses)
          );

          node.remove();
        }

      } else {

        clickTimer = setTimeout(() => {
          clickTimer = null;
        }, 250);

      }

    } else {

      overlay.classList.add("is-open");
      display.innerText = text;

    }

  });

  orbit.appendChild(node);

  requestAnimationFrame(() => {
    node.classList.add("show");
  });
}

/* ===== INITIAL LOAD ===== */

responses.forEach(createNode);

/* ===== INPUT ===== */

input.addEventListener("keydown", function(e) {

  if (e.key === "Enter" && input.value.trim() !== "") {

    const text = input.value.trim();

    responses.push(text);

    localStorage.setItem(
      "ban_responses",
      JSON.stringify(responses)
    );

    createNode(text);

    input.value = "";

  }

});

/* ===== CLOSE RESPONSE OVERLAY ===== */

overlay.onclick = () => {
  overlay.classList.remove("is-open");
};

/* ===== TIMELINE MENU ===== */

const timelineToggle = document.getElementById('timelineToggle');

const timelineOverlay = document.getElementById('timelineOverlay');

timelineToggle.addEventListener('click', () => {
  timelineOverlay.classList.toggle('is-open');
});

timelineOverlay.addEventListener('click', (e) => {

  if (e.target === timelineOverlay) {
    timelineOverlay.classList.remove('is-open');
  }

});

</script>

</body>
</html>

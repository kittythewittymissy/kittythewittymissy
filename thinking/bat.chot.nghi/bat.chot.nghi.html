<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bất chợt nghĩ</title>

<!-- FAVICON -->
<link rel="icon" href="../../favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="../../favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../favicon/apple-touch-icon.png">
<link rel="manifest" href="../../favicon/site.webmanifest">

<!-- FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;600&family=Raleway+Dots&family=Codystar:wght@300;400;500&display=swap&subset=vietnamese" rel="stylesheet">

<!-- GLOBAL CSS -->
<link rel="stylesheet" href="../../style.css">

<style>

/* --- WORK TITLE --- */
 .work-title { 
    position: relative;
    top: auto;
    padding: 2rem 5rem;
}
    
 .work-title h1 {
    font-family: 'Raleway', sans-serif;
    z-index: 1;
    font-size: 4rem;
    letter-spacing: 0.16em;
    font-weight: 100;
    color: #222;
    text-shadow:
        0 0 1px var(--gold-core),
        0 0 2px var(--gold-core),
        0 0 4px var(--gold-core);
    opacity: 0;
    animation: neonSign-Gold 1.2s ease forwards;
    animation-delay:0.3s;
}
    
 @keyframes neonSign-Gold {
    0% { opacity:0; color:#222; text-shadow:none; }
    8% { opacity:1; color:var(--gold-core); text-shadow:0 0 3px var(--gold-core); }
    16% { opacity:0; color:#222; text-shadow:none; }
    25% { opacity:1; color:var(--gold-core); text-shadow:0 0 6px var(--gold-core),0 0 10px rgba(255,214,98,0.7); }
    50% { opacity:1; color:#fff; text-shadow:0 0 10px #fff,0 0 18px var(--gold-core); }
    66% { opacity:1; color:var(--gold-core); text-shadow:0 0 6px var(--gold-core),0 0 12px rgba(255,214,98,0.8); }
    83% { opacity:0.6; color:#222; text-shadow:none; }
    92% { opacity:1; color:var(--gold-core); text-shadow:0 0 4px var(--gold-core),0 0 12px rgba(255,214,98,0.7); }
    100% { opacity:1; color:var(--gold-core); text-shadow:0 0 2px var(--gold-core),0 0 6px var(--gold-core),0 0 12px rgba(255,214,98,0.8),0 0 16px rgba(255,214,98,0.6); }
}

/* EXPANSION */
.expansion {
  position: absolute;         
  max-width: 40%;
  padding-top: 5rem;
  opacity: 0;
  transform: translateY(25px);
  transition: opacity 1.6s ease, transform 1.6s ease;

  text-align: left;
  font-size: 1.5rem;
  line-height: 1.8;
  color: rgba(255,255,255,0.85);
  pointer-events: none;
}

/* APHORISM */
.aphorism {
  position: absolute;
  max-width: 600px;
  text-align: center;
  font-size: 2rem;
  text-shadow: var(--glow-white);
  cursor: pointer;
  z-index: 2;
  transition: transform 1.4s cubic-bezier(.2,.8,.2,1), opacity 1.2s ease;
}

/* OPEN STATE */
.stage.open .expansion {
  opacity: 1;
  transform: translateY(0);
}

.stage.open .aphorism {
  transform: translateY(145px) scale(0.95);
  opacity: 0.55;
}

</style>
</head>

<body>

<a class="back-button" href="../index.html">
  <span class="back-text">Back to</span>
  <span class="kitty-text">KITTY</span>
</a>

<div class="work-title">
  <h1>Bất chợt nghĩ</h1>
</div>

<div class="stage" id="stage">

  <div class="spotlight-cone"></div>
  <div class="spotlight-pool"></div>
  <div class="spotlight-vignette"></div>

  <div class="aphorism" onclick="toggleStage()">
    [SUY NGHĨ]
  </div>

  <div class="expansion">
    <p>
     [SUY NGHĨ]
    </p>

    <p>
      [SUY NGHĨ]
    </p>

    <p>
      [SUY NGHĨ]
    </p>
  </div>

</div>

<script>
function toggleStage() {
  document.getElementById("stage").classList.toggle("open");
}
</script>

</body>
</html>
